<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>🏆 La Porra — Mundial 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#07090f;--surface:#0f1420;--card:#161d2e;--border:#1f2b44;
  --gold:#f0b429;--gold-dim:#8a6200;--gold-bg:rgba(240,180,41,.08);
  --green:#22c55e;--green-dim:#14532d;--green-bg:rgba(34,197,94,.07);
  --blue:#3b82f6;--red:#ef4444;--red-dim:#7f1d1d;
  --txt:#e2e8f0;--txt-dim:#64748b;--radius:10px;
}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--txt);font-family:'Inter',sans-serif;font-size:14px;min-height:100dvh;-webkit-tap-highlight-color:transparent}
button{cursor:pointer;font-family:inherit;border:none;outline:none}
input,select,textarea{font-family:inherit;outline:none;border:none}

/* UTILS */
.hidden{display:none!important}
.spin{animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* TOAST */
#toast{position:fixed;bottom:76px;left:50%;transform:translateX(-50%) translateY(80px);background:#1e293b;border:1px solid var(--border);border-radius:8px;padding:10px 18px;font-size:13px;font-weight:500;transition:transform .3s cubic-bezier(.34,1.56,.64,1);z-index:9999;white-space:nowrap;pointer-events:none}
#toast.show{transform:translateX(-50%) translateY(0)}
#toast.ok{border-color:var(--green);color:var(--green)}
#toast.err{border-color:var(--red);color:var(--red)}

/* AUTH */
#auth-overlay{position:fixed;inset:0;z-index:1000;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:24px}
.auth-box{width:100%;max-width:360px;background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:36px 28px}
.auth-logo{text-align:center;margin-bottom:28px}
.auth-logo .trophy{font-size:48px;display:block;margin-bottom:8px}
.auth-logo h1{font-family:'Bebas Neue',sans-serif;font-size:28px;letter-spacing:2px;color:var(--gold)}
.auth-logo p{font-size:12px;color:var(--txt-dim);margin-top:4px}
.auth-tabs{display:flex;margin-bottom:24px;border-radius:8px;overflow:hidden;border:1px solid var(--border)}
.auth-tab{flex:1;padding:10px;background:transparent;color:var(--txt-dim);font-size:13px;font-weight:600;transition:all .2s}
.auth-tab.active{background:var(--gold);color:#07090f}
.field{margin-bottom:14px}
.field label{display:block;font-size:11px;font-weight:600;color:var(--txt-dim);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}
.field input{width:100%;background:var(--card);border:1px solid var(--border);border-radius:8px;padding:11px 14px;color:var(--txt);font-size:14px;transition:border-color .2s}
.field input:focus{border-color:var(--gold)}
.btn-primary{width:100%;padding:13px;border-radius:8px;background:var(--gold);color:#07090f;font-size:14px;font-weight:700;letter-spacing:.5px;transition:opacity .2s,transform .1s;margin-top:4px}
.btn-primary:hover{opacity:.9}
.btn-primary:active{transform:scale(.98)}
.btn-primary:disabled{opacity:.5;cursor:not-allowed}

/* APP */
#app{display:flex;flex-direction:column;min-height:100dvh}
.app-header{background:var(--surface);border-bottom:1px solid var(--border);padding:12px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.app-header h1{font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:2px;color:var(--gold)}
.header-right{display:flex;align-items:center;gap:8px}
.user-name{font-size:13px;font-weight:600;max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.admin-badge{background:rgba(240,180,41,.15);border:1px solid var(--gold-dim);color:var(--gold);padding:3px 8px;border-radius:5px;font-size:11px;font-weight:700}
.btn-logout{background:var(--card);border:1px solid var(--border);color:var(--txt-dim);padding:6px 10px;border-radius:6px;font-size:12px;transition:all .2s}
.btn-logout:hover{border-color:var(--red);color:var(--red)}

/* STATUS BAR */
.status-bar{background:var(--surface);border-bottom:1px solid var(--border);padding:8px 16px;display:flex;align-items:center;gap:8px;font-size:12px}
.status-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.status-dot.open{background:var(--green);box-shadow:0 0 5px var(--green)}
.status-dot.closed{background:var(--red)}
.status-dot.live{background:var(--gold);box-shadow:0 0 5px var(--gold);animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}

/* BOTTOM NAV */
.bottom-nav{position:sticky;bottom:0;z-index:100;background:var(--surface);border-top:1px solid var(--border);display:flex}
.nav-btn{flex:1;padding:10px 4px 8px;background:transparent;color:var(--txt-dim);display:flex;flex-direction:column;align-items:center;gap:3px;font-size:9px;font-weight:600;text-transform:uppercase;letter-spacing:.3px;transition:color .2s;border-top:2px solid transparent}
.nav-btn .icon{font-size:18px}
.nav-btn.active{color:var(--gold);border-top-color:var(--gold)}

/* MAIN */
.main-content{flex:1;padding:16px;max-width:720px;margin:0 auto;width:100%;overflow-x:hidden}
.section-header{margin-bottom:14px}
.section-header h2{font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:2px;color:var(--gold)}
.section-header p{font-size:12px;color:var(--txt-dim);margin-top:2px}

/* SAVE BAR */
.save-bar{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:10px 14px;display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:8px}
.save-bar-left{font-size:12px;color:var(--txt-dim)}
.progress-pill{font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;background:var(--card);border:1px solid var(--border);color:var(--txt-dim);white-space:nowrap}
.progress-pill.done{color:var(--green);border-color:var(--green-dim)}
.btn-save{background:var(--green);color:#fff;padding:7px 16px;border-radius:7px;font-size:13px;font-weight:700;transition:opacity .2s;white-space:nowrap;flex-shrink:0}
.btn-save:disabled{opacity:.4;cursor:not-allowed}

/* LOCKED */
.locked-bar{background:rgba(239,68,68,.08);border:1px solid var(--red-dim);border-radius:var(--radius);padding:10px 14px;margin-bottom:14px;font-size:12px;color:#fca5a5;display:flex;align-items:center;gap:8px}

/* PHASE TABS */
.phase-tabs{display:flex;gap:4px;margin-bottom:12px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.phase-tabs::-webkit-scrollbar{display:none}
.phase-tab{padding:6px 12px;border-radius:7px;font-size:12px;font-weight:600;background:var(--card);border:1px solid var(--border);color:var(--txt-dim);white-space:nowrap;transition:all .15s;flex-shrink:0}
.phase-tab.active{background:var(--gold);color:#07090f;border-color:var(--gold)}

/* MATCH CARDS */
.match-list{display:flex;flex-direction:column;gap:8px}
.match-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
.match-card.correct-sign{border-color:rgba(34,197,94,.3)}
.match-card.correct-exact{border-color:var(--gold-dim);background:linear-gradient(135deg,rgba(240,180,41,.05),transparent)}
.match-header{background:var(--surface);padding:5px 12px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border)}
.match-label{font-size:10px;font-weight:700;color:var(--txt-dim);text-transform:uppercase;letter-spacing:.5px}
.match-pts-label{font-size:10px;font-weight:700;color:var(--gold)}
.match-body{padding:10px 12px;display:flex;align-items:center;gap:8px}
.match-team-name{flex:1;font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.match-team-name.home{text-align:right}
.match-team-name.away{text-align:left}
.match-flag{font-size:22px;flex-shrink:0}
.score-wrap{display:flex;align-items:center;gap:6px;flex-shrink:0}
.score-box{width:42px;background:var(--surface);border:1px solid var(--border);border-radius:7px;padding:7px 4px;color:var(--txt);font-size:18px;font-weight:700;text-align:center;transition:border-color .2s}
.score-box:focus{border-color:var(--gold)}
.score-box:disabled{opacity:.5;cursor:default}
.score-sep{font-size:16px;font-weight:700;color:var(--txt-dim)}
.match-footer{padding:0 12px 8px;display:flex;align-items:center;gap:6px}
.penalties-label{font-size:11px;color:var(--txt-dim);font-weight:600}
.pen-btn{padding:4px 10px;border-radius:5px;font-size:11px;font-weight:700;border:1px solid var(--border);background:var(--surface);color:var(--txt-dim);transition:all .15s}
.pen-btn.active{border-color:var(--gold);background:var(--gold-bg);color:var(--gold)}

/* GRUPOS TAB - clasificación */
.group-standings{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;margin-bottom:10px}
.group-standings-header{background:var(--surface);padding:7px 12px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border)}
.group-standings-label{font-family:'Bebas Neue',sans-serif;font-size:15px;letter-spacing:1px;color:var(--gold)}
.standings-table{width:100%;border-collapse:collapse;font-size:12px}
.standings-table td{padding:7px 8px;border-bottom:1px solid var(--border)}
.standings-table tr:last-child td{border-bottom:none}
.standings-table .pos-cell{width:20px;font-weight:700;color:var(--txt-dim)}
.standings-table .flag-cell{width:28px}
.standings-table .name-cell{font-weight:600}
.standings-table .num-cell{width:30px;text-align:center;color:var(--txt-dim)}
.standings-table .pts-cell{width:32px;text-align:center;font-weight:700}
.pos-badge{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:50%;font-size:10px;font-weight:700}
.pos-badge.p1{background:var(--gold);color:#07090f}
.pos-badge.p2{background:var(--green);color:#fff}
.pos-badge.p3{background:rgba(148,163,184,.3);color:var(--txt)}
.pos-badge.p4{background:var(--red-dim);color:var(--txt-dim)}

/* TERCEROS */
.terceros-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:10px}
@media(max-width:400px){.terceros-grid{grid-template-columns:repeat(2,1fr)}}
.tercero-card{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:8px;text-align:center;cursor:pointer;transition:all .15s}
.tercero-card:hover{border-color:var(--txt-dim)}
.tercero-card.selected{border-color:var(--gold);background:var(--gold-bg)}
.tercero-card.maxed{opacity:.4;cursor:not-allowed}
.tercero-flag{font-size:24px;display:block;margin-bottom:4px}
.tercero-name{font-size:11px;font-weight:600;line-height:1.2}
.tercero-group{font-size:10px;color:var(--txt-dim)}

/* PREMIOS */
.premio-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:10px}
.premio-card h3{font-size:13px;font-weight:700;color:var(--gold);margin-bottom:2px;display:flex;align-items:center;justify-content:space-between}
.premio-pts{font-size:11px;font-weight:700;padding:2px 7px;border-radius:4px;background:var(--surface);border:1px solid var(--border);color:var(--txt-dim)}
.premio-card p{font-size:11px;color:var(--txt-dim);margin-bottom:10px}
.text-input{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:10px 12px;color:var(--txt);font-size:14px;transition:border-color .2s}
.text-input:focus{border-color:var(--gold)}
.text-input:disabled{opacity:.5}
.num-input{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:10px 12px;color:var(--txt);font-size:14px;transition:border-color .2s}
.num-input:focus{border-color:var(--gold)}
.num-input:disabled{opacity:.5}

/* CLASIFICACION */
.rank-list{display:flex;flex-direction:column;gap:6px}
.rank-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px;display:flex;align-items:center;gap:12px}
.rank-card.me{border-color:var(--gold-dim);background:var(--gold-bg)}
.rank-pos{font-family:'Bebas Neue',sans-serif;font-size:26px;color:var(--txt-dim);width:30px;text-align:center;flex-shrink:0;line-height:1}
.rank-pos.g{color:var(--gold)}
.rank-pos.s{color:#94a3b8}
.rank-pos.b{color:#cd7f32}
.rank-info{flex:1;min-width:0}
.rank-name{font-size:14px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rank-sub{font-size:11px;color:var(--txt-dim);margin-top:2px}
.rank-pts-wrap{text-align:right;flex-shrink:0}
.rank-pts{font-size:22px;font-weight:700;color:var(--gold);display:block;line-height:1}
.rank-pts-label{font-size:10px;color:var(--txt-dim);font-weight:600;text-transform:uppercase}
.me-badge{font-size:10px;font-weight:700;color:var(--gold);border:1px solid var(--gold-dim);border-radius:4px;padding:1px 5px;margin-left:6px}
.pts-breakdown{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.pts-chip{font-size:10px;background:var(--surface);border:1px solid var(--border);border-radius:4px;padding:2px 6px;color:var(--txt-dim)}
.pts-chip.hit{color:var(--green);border-color:var(--green-dim)}

/* ADMIN */
.admin-section{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:10px}
.admin-section h3{font-size:13px;font-weight:700;color:var(--gold);margin-bottom:12px;display:flex;align-items:center;gap:6px}
.admin-match-row{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--border)}
.admin-match-row:last-child{border-bottom:none}
.admin-match-info{flex:1;min-width:0}
.admin-match-name{font-size:12px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.admin-match-sub{font-size:10px;color:var(--txt-dim);margin-top:1px}
.admin-score-wrap{display:flex;align-items:center;gap:4px;flex-shrink:0}
.admin-score{width:38px;background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:5px 4px;color:var(--txt);font-size:16px;font-weight:700;text-align:center;transition:border-color .2s}
.admin-score:focus{border-color:var(--gold)}
.admin-score-sep{font-size:14px;color:var(--txt-dim)}
.admin-pen-wrap{display:flex;gap:4px;margin-left:4px}
.admin-pen-btn{padding:4px 8px;border-radius:5px;font-size:11px;font-weight:700;border:1px solid var(--border);background:var(--surface);color:var(--txt-dim);transition:all .15s;white-space:nowrap}
.admin-pen-btn.active{border-color:var(--gold);background:var(--gold-bg);color:var(--gold)}
.admin-save-btn{background:var(--green);color:#fff;padding:6px 14px;border-radius:6px;font-size:12px;font-weight:700;transition:opacity .2s;margin-top:10px}
.admin-save-btn:hover{opacity:.85}
.admin-control-wrap{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.btn-state{padding:7px 12px;border-radius:7px;font-size:12px;font-weight:700;border:1px solid;transition:all .2s}
.btn-state.open{background:rgba(34,197,94,.1);border-color:var(--green);color:var(--green)}
.btn-state.closed{background:rgba(239,68,68,.1);border-color:var(--red);color:var(--red)}
.btn-state.live{background:rgba(240,180,41,.1);border-color:var(--gold);color:var(--gold)}

.empty-state{text-align:center;padding:40px 20px;color:var(--txt-dim);font-size:13px}
.empty-state .icon{font-size:36px;display:block;margin-bottom:8px;opacity:.5}
.info-chip{display:inline-flex;align-items:center;gap:5px;font-size:11px;background:rgba(59,130,246,.08);border:1px solid rgba(59,130,246,.2);color:#93c5fd;border-radius:6px;padding:4px 10px;margin-bottom:10px}
</style>
</head>
<body>

<div id="auth-overlay" class="hidden">
  <div class="auth-box">
    <div class="auth-logo">
      <span class="trophy">🏆</span>
      <h1>La Porra</h1>
      <p>Mundial USA · Canadá · México 2026</p>
    </div>
    <div class="auth-tabs">
      <button class="auth-tab active" onclick="switchAuthTab('login')">Entrar</button>
      <button class="auth-tab" onclick="switchAuthTab('register')">Registrarse</button>
    </div>
    <div id="form-login">
      <div class="field"><label>Nombre</label><input type="text" id="l-name" placeholder="Tu nombre de usuario" autocomplete="username"></div>
      <div class="field"><label>Contraseña</label><input type="password" id="l-pass" placeholder="••••••" autocomplete="current-password"></div>
      <button class="btn-primary" onclick="doLogin()">Entrar</button>
    </div>
    <div id="form-register" class="hidden">
      <div class="field"><label>Nombre</label><input type="text" id="r-name" placeholder="Cómo te llaman" autocomplete="username"></div>
      <div class="field"><label>Contraseña</label><input type="password" id="r-pass" placeholder="Mínimo 6 caracteres" autocomplete="new-password"></div>
      <button class="btn-primary" onclick="doRegister()">Crear cuenta</button>
    </div>
  </div>
</div>

<div id="app" class="hidden">
  <header class="app-header">
    <h1>🏆 La Porra 2026</h1>
    <div class="header-right">
      <span id="header-name" class="user-name"></span>
      <span id="admin-badge" class="admin-badge hidden">ADMIN</span>
      <button class="btn-logout" onclick="doLogout()">Salir</button>
    </div>
  </header>

  <div id="status-bar" class="status-bar hidden">
    <div id="status-dot" class="status-dot open"></div>
    <span id="status-text" style="color:var(--txt-dim)"></span>
  </div>

  <div class="main-content" id="main-content">
    <!-- injected by JS -->
  </div>

  <nav class="bottom-nav" id="bottom-nav">
    <button class="nav-btn active" onclick="switchTab('grupos')" id="nav-grupos"><span class="icon">🗂️</span>Grupos</button>
    <button class="nav-btn" onclick="switchTab('elim')" id="nav-elim"><span class="icon">🏟️</span>Elim.</button>
    <button class="nav-btn" onclick="switchTab('premios')" id="nav-premios"><span class="icon">🏅</span>Premios</button>
    <button class="nav-btn" onclick="switchTab('clasif')" id="nav-clasif"><span class="icon">🏆</span>Clasif.</button>
    <button class="nav-btn hidden" onclick="switchTab('admin')" id="nav-admin"><span class="icon">⚙️</span>Admin</button>
  </nav>
</div>

<div id="toast"></div>

function calcProgress(){
  const gTotal=GROUP_MATCHES.length; // 72
  const gDone=Object.values(S.preds.groups||{}).filter(v=>v.home!==''&&v.home!==null&&v.home!==undefined&&v.away!==''&&v.away!==null&&v.away!==undefined).length;
  const tDone=(S.preds.terceros||[]).length;
  const eDone=Object.values(S.preds.elim||{}).filter(v=>v.home!==''&&v.home!==null&&v.away!==''&&v.away!==null).length;
  const elimTotal=ELIM_PHASES.reduce((a,p)=>a+p.matches.length,0); // 32
  const pDone=(S.preds.balon?1:0)+(S.preds.maxGolEsp?1:0)+(S.preds.mejorJoven?1:0)+(S.preds.maxGolesGol!==''&&S.preds.maxGolesGol!==null&&S.preds.maxGolesGol!==undefined?1:0)+(S.preds.champion?1:0);
  const total=gTotal+8+elimTotal+5;
  const done=gDone+tDone+eDone+pDone;
  return Math.round(done/total*100);
}

/* ═══════════════════════════════════════════
   HELPERS — GROUP STANDINGS FROM MATCH RESULTS
═══════════════════════════════════════════ */
function computeStandings(groupKey, matchResults){
  // matchResults: {matchId:{home:X,away:Y}} where X,Y are goals or ''
  const teams=GRUPOS[groupKey].teams;
  const table={};
  teams.forEach(t=>{table[t]={pts:0,j:0,g:0,e:0,p:0,gf:0,gc:0,dg:0};});
  GROUP_MATCHES.filter(m=>m.group===groupKey).forEach(m=>{
    const r=matchResults[m.id];
    if(!r||r.home===''||r.home===null||r.home===undefined||r.away===''||r.away===null||r.away===undefined) return;
    const h=parseInt(r.home),a=parseInt(r.away);
    if(isNaN(h)||isNaN(a)) return;
    table[m.home].j++;table[m.away].j++;
    table[m.home].gf+=h;table[m.home].gc+=a;table[m.home].dg+=h-a;
    table[m.away].gf+=a;table[m.away].gc+=h;table[m.away].dg+=a-h;
    if(h>a){table[m.home].g++;table[m.home].pts+=3;table[m.away].p++;}
    else if(h<a){table[m.away].g++;table[m.away].pts+=3;table[m.home].p++;}
    else{table[m.home].e++;table[m.home].pts++;table[m.away].e++;table[m.away].pts++;}
  });
  return Object.entries(table).map(([name,s])=>({name,...s}))
    .sort((a,b)=>b.pts-a.pts||b.dg-a.dg||b.gf-a.gf);
}

function getTeamAtPos(groupKey,pos,predOrResult){
  // pos: 1-based
  const standings=computeStandings(groupKey,predOrResult);
  return standings[pos-1]?.name||null;
}

// Resolve a position code like '1A','2B','T3_ABCDF' from predictions or results
function resolveTeam(code, src){
  // src = 'pred' or 'result'
  const data=src==='result'?S.results:S.preds;
  if(!code) return null;
  if(/^[12][A-L]$/.test(code)){
    const pos=parseInt(code[0]),g=code[1];
    return getTeamAtPos(g,pos,src==='result'?S.results.groups||{}:S.preds.groups||{});
  }
  if(code.startsWith('T3_')){
    // best third — use assigned terceros order
    const thirds=src==='result'?(S.results.terceros||[]):(S.preds.terceros||[]);
    const slotMap={T3_ABCDF:0,T3_CDFGH:1,T3_CEFHI:2,T3_EHIJK:3,T3_BEFIJ:4,T3_AEHIJ:5,T3_EFGIJ:6,T3_DEIJL:7};
    const idx=slotMap[code];
    return (idx!==undefined&&thirds[idx])||null;
  }
  return null;
}

function getElimWinner(matchId,src){
  const data=src==='result'?S.results.elim||{}:S.preds.elim||{};
  const r=data[matchId];
  if(!r||r.home===''||r.home===null||r.away===''||r.away===null) return null;
  const h=parseInt(r.home),a=parseInt(r.away);
  if(isNaN(h)||isNaN(a)) return null;
  if(h>a) return r.homeTeam||null;
  if(a>h) return r.awayTeam||null;
  // draw → penalties
  if(r.pen==='home') return r.homeTeam||null;
  if(r.pen==='away') return r.awayTeam||null;
  return null;
}

function getElimLoser(matchId,src){
  const w=getElimWinner(matchId,src);
  const data=src==='result'?S.results.elim||{}:S.preds.elim||{};
  const r=data[matchId];
  if(!w||!r) return null;
  return w===r.homeTeam?r.awayTeam:r.homeTeam;
}

function resolveElimTeam(code,src){
  if(!code) return null;
  if(code.endsWith('_loser')){
    const mid=code.replace('_loser','');
    return getElimLoser(mid,src);
  }
  // srcA/srcB codes are match ids
  return getElimWinner(code,src);
}

function renderGroupMatchCard(m){
  const r=S.preds.groups[m.id]||{home:'',away:''};
  const real=S.results.groups?.[m.id];
  const locked=isLocked();
  let pts='';
  if(real&&real.home!==''&&real.away!==''){
    const p=scorePoints(r,real);
    pts=p>0?`<span class="match-pts-label">+${p} pts</span>`:'';
  }
  const sign=getSign(r);
  const realSign=real?getSign(real):null;
  const isExact=real&&String(r.home)===String(real.home)&&String(r.away)===String(real.away);
  const isSignOk=real&&sign&&sign===realSign;
  const cardClass=isExact?'correct-exact':isSignOk?'correct-sign':'';
  return `<div class="match-card ${cardClass}">
  <div class="match-header">
    <span class="match-label">${m.label}</span>
    ${pts}
    ${real&&real.home!==''?`<span style="font-size:10px;color:var(--txt-dim)">Real: ${real.home}–${real.away}</span>`:''}
  </div>
  <div class="match-body">
    <span class="match-flag">${fl(m.home)}</span>
    <span class="match-team-name home">${m.home}</span>
    <div class="score-wrap">
      <input class="score-box" type="number" min="0" max="20" value="${r.home===''||r.home===null||r.home===undefined?'':r.home}" ${locked?'disabled':''}
        oninput="setGroupScore('${m.id}','home',this.value)" placeholder="–">
      <span class="score-sep">–</span>
      <input class="score-box" type="number" min="0" max="20" value="${r.away===''||r.away===null||r.away===undefined?'':r.away}" ${locked?'disabled':''}
        oninput="setGroupScore('${m.id}','away',this.value)" placeholder="–">
    </div>
    <span class="match-team-name away">${m.away}</span>
    <span class="match-flag">${fl(m.away)}</span>

</div>`;

function getSign(r){
  if(!r||r.home===''||r.home===null||r.away===''||r.away===null) return null;
  const h=parseInt(r.home),a=parseInt(r.away);
  if(isNaN(h)||isNaN(a)) return null;
  return h>a?'1':h<a?'2':'X';
}

function scorePoints(pred,real){
  if(!pred||!real||pred.home===''||pred.home===null||real.home===''||real.home===null) return 0;
  let p=0;
  const ps=getSign(pred),rs=getSign(real);
  if(ps&&rs&&ps===rs) p+=PTS.sign;
  if(String(pred.home)===String(real.home)&&String(pred.away)===String(real.away)) p+=PTS.exact;
  return p;
}

function renderElimMatchCard(m,phase,pts,src){
  const data=src==='result'?S.results.elim||{}:S.preds.elim||{};
  const r=data[m.id]||{home:'',away:'',pen:null,homeTeam:null,awayTeam:null};
  const locked=isLocked()&&src==='pred';

  // Resolve teams
  let homeTeam=r.homeTeam||null;
  let awayTeam=r.awayTeam||null;
  if(!homeTeam){
    if(m.home) homeTeam=resolveTeam(m.home,src);
    else if(m.srcA){
      homeTeam=m.srcA.endsWith('_loser')?resolveElimTeam(m.srcA,src):resolveElimTeam(m.srcA,src);
    }
  }
  if(!awayTeam){
    if(m.away) awayTeam=resolveTeam(m.away,src);
    else if(m.srcB){
      awayTeam=resolveElimTeam(m.srcB,src);
    }
  }

  // Store resolved teams in data if pred mode
  if(src==='pred'&&(homeTeam||awayTeam)){
    if(!S.preds.elim[m.id]) S.preds.elim[m.id]={home:'',away:'',pen:null};
    S.preds.elim[m.id].homeTeam=homeTeam;
    S.preds.elim[m.id].awayTeam=awayTeam;
  }

  const realR=S.results.elim?.[m.id];
  let ptsLabel='';
  if(realR&&realR.home!==''&&realR.home!==null&&src==='pred'){
    const p=scorePoints(r,realR);
    if(p>0) ptsLabel=`<span class="match-pts-label">+${p} pts</span>`;
  }

  const sign=getSign(r);
  const drawPred=sign==='X';
  const homeVal=r.home===''||r.home===null||r.home===undefined?'':r.home;
  const awayVal=r.away===''||r.away===null||r.away===undefined?'':r.away;

  const tbd=`<span style="font-size:13px;color:var(--txt-dim);font-style:italic">Por definir</span>`;

  let html=`<div class="match-card">
  <div class="match-header">
    <span class="match-label">${m.label}${pts>0?` · ${pts} pts/clasificado`:''}</span>
    ${ptsLabel}
    ${realR&&realR.home!==''?`<span style="font-size:10px;color:var(--txt-dim)">Real: ${realR.home}–${realR.away}${realR.pen?` (pen.${realR.pen})`:''}  </span>`:''}
  </div>
  <div class="match-body">

    <span class="match-team-name home">${homeTeam||'Por definir'}</span>

      <input class="score-box" type="number" min="0" max="20" value="${homeVal}" ${locked||!homeTeam||!awayTeam?'disabled':''}
        oninput="setElimScore('${m.id}','home',this.value,'${esc(homeTeam||'')}','${esc(awayTeam||'')}');" placeholder="–">

    <span class="match-team-name away">${awayTeam||'Por definir'}</span>

/* ═══════════════════════════════════════════
   SCORING ENGINE
═══════════════════════════════════════════ */
function calcScore(preds,results){
  let pts=0;
  const breakdown={};
  if(!results||!preds) return{pts,breakdown};

  // Groups — match points
  const rGroups=results.groups||{};
  const pGroups=preds.groups||{};
  GROUP_MATCHES.forEach(m=>{
    const pr=pGroups[m.id],re=rGroups[m.id];
    if(!re||re.home===''||re.home===null||re.away===''||re.away===null) return;
    if(!pr||pr.home===''||pr.home===null||pr.away===''||pr.away===null) return;
    const p=scorePoints(pr,re);
    if(p>0){pts+=p;breakdown[m.id]=p;}
  });

  // Groups — position points + qual
  Object.keys(GRUPOS).forEach(g=>{
    const realStandings=computeStandings(g,rGroups);
    const predStandings=computeStandings(g,pGroups);
    const rTop=(results.terceros||[]);
    const pThirds=(preds.terceros||[]);

    // pos 1 exact
    if(realStandings[0]&&predStandings[0]&&realStandings[0].name===predStandings[0].name){pts+=PTS.pos1;breakdown[`pos1_${g}`]=PTS.pos1;}
    // pos 2 exact
    if(realStandings[1]&&predStandings[1]&&realStandings[1].name===predStandings[1].name){pts+=PTS.pos2;breakdown[`pos2_${g}`]=PTS.pos2;}

    // qualified for 16avos (top 2 + best thirds)
    const realQual=new Set([realStandings[0]?.name,realStandings[1]?.name,...rTop]);
    const predQual=[predStandings[0]?.name,predStandings[1]?.name,...pThirds];
    predQual.forEach(t=>{
      if(t&&realQual.has(t)){pts+=PTS.qual;breakdown[`qual_${t}`]=PTS.qual;}
    });
  });

  // Elim — match points + classification points
  const rElim=results.elim||{};
  const pElim=preds.elim||{};
  ELIM_PHASES.forEach(({phase,pts:phasePts,matches})=>{
    matches.forEach(m=>{
      const pr=pElim[m.id],re=rElim[m.id];
      // match score points
      if(re&&re.home!==''&&re.home!==null&&pr&&pr.home!==''&&pr.home!==null){
        const p=scorePoints(pr,re);
        if(p>0){pts+=p;breakdown[m.id+'_score']=p;}
      }
      // classification: acertar el ganador
      if(phasePts>0){
        const rWin=getElimWinner(m.id,'result');
        const pWin=getElimWinner(m.id,'pred');
        if(rWin&&pWin&&rWin===pWin){pts+=phasePts;breakdown[m.id+'_clasif']=phasePts;}
      }
    });
  });

  // Champion
  if(results.champion&&preds.champion&&normalize(preds.champion)===normalize(results.champion)){pts+=PTS.champion;breakdown['champion']=PTS.champion;}

  // Premios
  const pr=[
    {k:'balon',pts:PTS.balon},{k:'maxGolEsp',pts:PTS.maxGolEsp},
    {k:'mejorJoven',pts:PTS.mejorJoven},{k:'maxGolesGol',pts:PTS.maxGolesGol}
  ];
  pr.forEach(({k,pts:p})=>{
    if(results[k]&&preds[k]&&normalize(String(preds[k]))===normalize(String(results[k]))){pts+=p;breakdown[k]=p;}
  });

  return{pts,breakdown};
}

function normalize(s){return(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim();}

function subscribeRealtime(){

function renderClasifTab(mc){
  let html=`<div class="section-header"><h2>Clasificación</h2><p>Puntuación en tiempo real.</p></div>`;

    html+=`<div class="empty-state"><span class="icon">🔒</span>La clasificación se muestra cuando empiece el torneo</div>`;
    mc.innerHTML=html;return;
  }

  const scored=S.allUsers.filter(u=>u.preds).map(u=>{
    const{pts,breakdown}=calcScore(u.preds,S.results);
    return{...u,pts,breakdown};
  }).sort((a,b)=>b.pts-a.pts);

  if(scored.length===0){
    html+=`<div class="empty-state"><span class="icon">😴</span>Nadie ha guardado pronósticos todavía</div>`;
    mc.innerHTML=html;return;

  html+=`<div class="rank-list">`;

    const posCls=pos===1?'g':pos===2?'s':pos===3?'b':'';
    const medal=pos===1?'🥇':pos===2?'🥈':pos===3?'🥉':pos;
    const champ=u.preds?.champion||'';
    const topBreakdown=Object.entries(u.breakdown||{}).filter(([,v])=>v>0).sort((a,b)=>b[1]-a[1]).slice(0,4);
    html+=`<div class="rank-card ${isMe?'me':''}">

      <div class="rank-info">
        <div class="rank-name">${u.nombre||u.id}${isMe?'<span class="me-badge">Tú</span>':''}</div>
        ${champ?`<div class="rank-sub">${fl(champ)} ${champ}</div>`:''}
        ${topBreakdown.length>0?`<div class="pts-breakdown">${topBreakdown.map(([k,v])=>`<span class="pts-chip hit">+${v}</span>`).join('')}</div>`:''}
      </div>
      <div class="rank-pts-wrap">
        <span class="rank-pts">${u.pts}</span>
        <span class="rank-pts-label">pts</span>
      </div>
    </div>`;
  });
  html+=`</div>`;
  mc.innerHTML=html;
}

  // Grupos — por jornada
  html+=`<div class="admin-section"><h3>🗂️ Resultados de Grupos</h3>`;
  const adminPhaseTabsEl=`<div class="phase-tabs" style="margin-bottom:10px">`;
  html+=adminPhaseTabsEl;
  ['A','B','C','D','E','F','G','H','I','J','K','L'].forEach(g=>{
    html+=`<button class="phase-tab" onclick="adminSelectGroup('${g}',this)">${g}</button>`;
  });
  html+=`</div><div id="admin-group-content">`;
  // Default show A
  html+=adminGroupMatches('A');
  html+=`</div></div>`;

  // Mejores terceros reales
  html+=`<div class="admin-section"><h3>🎯 Mejores terceros reales (8)</h3>`;
  const realTerceros=S.results.terceros||[];
  Object.keys(GRUPOS).forEach(g=>{
    const s=computeStandings(g,S.results.groups||{});
    const third=s[2]?.name;
    if(!third) return;
    const isSel=realTerceros.includes(third);
    html+=`<button onclick="adminToggleTercero('${esc(third)}')" style="display:inline-flex;align-items:center;gap:5px;padding:5px 10px;margin:3px;border-radius:6px;border:1px solid ${isSel?'var(--gold)':'var(--border)'};background:${isSel?'var(--gold-bg)':'var(--surface)'};color:${isSel?'var(--gold)':'var(--txt)'};font-size:12px;cursor:pointer">
      ${fl(third)} ${third} (G.${g}) ${isSel?'✓':''}
    </button>`;
  });
  html+=`<div style="font-size:11px;color:var(--txt-dim);margin-top:6px">Seleccionados: ${realTerceros.length}/8</div>`;
  html+=`<button class="admin-save-btn" onclick="saveResults()">💾 Guardar terceros</button></div>`;

  // Eliminatorias
  ELIM_PHASES.forEach(ph=>{
    html+=`<div class="admin-section"><h3>🏟️ ${ph.label}</h3><div class="match-list">`;
    ph.matches.forEach(m=>{
      html+=renderAdminElimMatch(m,ph.phase);
    });
    html+=`</div><button class="admin-save-btn" onclick="saveResults()">💾 Guardar</button></div>`;
  });

  // Premios reales
  html+=`<div class="admin-section"><h3>🏅 Resultados Premios</h3>`;
  const premioFields=[
    {k:'champion',label:'Campeón',type:'text'},{k:'balon',label:'Balón de Oro',type:'text'},
    {k:'maxGolEsp',label:'Máx. Goleador España',type:'text'},{k:'mejorJoven',label:'Mejor Joven',type:'text'},
    {k:'maxGolesGol',label:'Goles máx. goleador',type:'number'},
  ];
  premioFields.forEach(f=>{
    html+=`<div class="field"><label>${f.label}</label>
    <input type="${f.type}" class="text-input" value="${S.results[f.k]||''}" 
      oninput="setAdminResult('${f.k}',this.value)" placeholder="${f.label}..."></div>`;
  });
  html+=`<button class="admin-save-btn" onclick="saveResults()">💾 Guardar premios</button></div>`;

  mc.innerHTML=html;
  // Activate first group tab
  const firstTab=mc.querySelector('#admin-group-tabs .phase-tab');
  if(firstTab) firstTab.classList.add('active');
}

function adminGroupMatches(g){
  let html='';
  GROUP_MATCHES.filter(m=>m.group===g).forEach(m=>{
    const r=S.results.groups?.[m.id]||{home:'',away:''};
    html+=`<div class="admin-match-row">
    <div class="admin-match-info">
      <div class="admin-match-name">${fl(m.home)} ${m.home} vs ${fl(m.away)} ${m.away}</div>
      <div class="admin-match-sub">${m.label}</div>
    </div>
    <div class="admin-score-wrap">
      <input class="admin-score" type="number" min="0" max="20" value="${r.home===''||r.home===null||r.home===undefined?'':r.home}" placeholder="–"
        oninput="setAdminGroupScore('${m.id}','home',this.value)">
      <span class="admin-score-sep">:</span>
      <input class="admin-score" type="number" min="0" max="20" value="${r.away===''||r.away===null||r.away===undefined?'':r.away}" placeholder="–"
        oninput="setAdminGroupScore('${m.id}','away',this.value)">
    </div>
    </div>`;
  });
  html+=`<button class="admin-save-btn" onclick="saveResults()">💾 Guardar</button>`;
  return html;
}

function adminSelectGroup(g,btn){
  if(btn){
    btn.closest('.admin-section').querySelectorAll('.phase-tab').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
  }
  document.getElementById('admin-group-content').innerHTML=adminGroupMatches(g);
}

function renderAdminElimMatch(m,phase){
  // Resolve teams from results
  let homeTeam=null,awayTeam=null;
  const rElim=S.results.elim||{};
  const re=rElim[m.id]||{};
  homeTeam=re.homeTeam||null;
  awayTeam=re.awayTeam||null;
  if(!homeTeam){
    if(m.home) homeTeam=resolveTeam(m.home,'result');
    else if(m.srcA) homeTeam=resolveElimTeam(m.srcA,'result');
  }
  if(!awayTeam){
    if(m.away) awayTeam=resolveTeam(m.away,'result');
    else if(m.srcB) awayTeam=resolveElimTeam(m.srcB,'result');
  }
  const hv=re.home===''||re.home===null||re.home===undefined?'':re.home;
  const av=re.away===''||re.away===null||re.away===undefined?'':re.away;
  const sign=getSign(re);
  const isDraw=sign==='X';
  let html=`<div class="match-card" style="margin-bottom:6px">
  <div class="match-header"><span class="match-label">${m.label}</span></div>
  <div class="match-body">
    <span class="match-flag">${homeTeam?fl(homeTeam):'❓'}</span>
    <span class="match-team-name home">${homeTeam||'TBD'}</span>
    <div class="score-wrap">
      <input class="admin-score" type="number" min="0" max="20" value="${hv}" placeholder="–"
        oninput="setAdminElimScore('${m.id}','home',this.value,'${esc(homeTeam||'')}','${esc(awayTeam||'')}')">
      <span class="admin-score-sep">:</span>
      <input class="admin-score" type="number" min="0" max="20" value="${av}" placeholder="–"
        oninput="setAdminElimScore('${m.id}','away',this.value,'${esc(homeTeam||'')}','${esc(awayTeam||'')}')">
    </div>
    <span class="match-team-name away">${awayTeam||'TBD'}</span>
    <span class="match-flag">${awayTeam?fl(awayTeam):'❓'}</span>
  </div>`;
  if(isDraw&&homeTeam&&awayTeam){
    const ph=re.pen==='home',pa=re.pen==='away';
    html+=`<div class="match-footer">
      <span class="penalties-label">Clasifica en penaltis:</span>
      <button class="pen-btn ${ph?'active':''}" onclick="setAdminPen('${m.id}','home')">${fl(homeTeam)} ${homeTeam}</button>
      <button class="pen-btn ${pa?'active':''}" onclick="setAdminPen('${m.id}','away')">${fl(awayTeam)} ${awayTeam}</button>
    </div>`;
  }
  html+=`</div>`;
  return html;
}

function setAdminGroupScore(id,side,val){
  if(!S.results.groups) S.results.groups={};
  if(!S.results.groups[id]) S.results.groups[id]={home:'',away:''};
  S.results.groups[id][side]=val===''?'':parseInt(val,10);
}
function setAdminElimScore(id,side,val,ht,at){
  if(!S.results.elim) S.results.elim={};
  if(!S.results.elim[id]) S.results.elim[id]={home:'',away:'',pen:null,homeTeam:ht||null,awayTeam:at||null};
  S.results.elim[id][side]=val===''?'':parseInt(val,10);
  S.results.elim[id].homeTeam=ht||S.results.elim[id].homeTeam;
  S.results.elim[id].awayTeam=at||S.results.elim[id].awayTeam;
  const sign=getSign(S.results.elim[id]);
  if(sign!=='X') S.results.elim[id].pen=null;
  renderAdminTab(document.getElementById('main-content'));
}
function setAdminPen(id,who){
  if(!S.results.elim[id]) S.results.elim[id]={};
  S.results.elim[id].pen=S.results.elim[id].pen===who?null:who;
  renderAdminTab(document.getElementById('main-content'));
}
function adminToggleTercero(team){
  if(!S.results.terceros) S.results.terceros=[];
  const idx=S.results.terceros.indexOf(team);
  if(idx>=0) S.results.terceros.splice(idx,1);
  else if(S.results.terceros.length<8) S.results.terceros.push(team);
  else{toast('Ya hay 8 terceros','err');return;}
  renderAdminTab(document.getElementById('main-content'));
}
function setAdminResult(key,val){S.results[key]=val;}
async function setTorneoState(state){
  S.torneoState=state;
  await fbSet('config','torneo',{state});
  updateStatusBar();
  toast('Estado: '+state);
  renderAdminTab(document.getElementById('main-content'));
}
async function saveResults(){
  try{
    await fbSet('config','resultados',S.results);
    toast('✅ Resultados guardados');
  }catch(e){toast('❌ Error: '+e.message,'err');}
}

/* ═══════════════════════════════════════════
   SMALL HELPERS
═══════════════════════════════════════════ */
function savebar(){
  const p=calcProgress();
  const locked=isLocked();
  return `<div class="save-bar">
  <span class="save-bar-left">Progreso</span>
  <span id="progress-pill" class="progress-pill ${p===100?'done':''}">${p}%</span>
  <button class="btn-save" id="btn-save" onclick="saveAll()" ${locked?'disabled':''}>
    ${locked?'🔒 Cerrado':'💾 Guardar'}
  </button>
  </div>`;
}
function lockedbar(){
  return`<div class="locked-bar">🔒 Pronósticos cerrados — solo lectura.</div>`;
}
function esc(s){return(s||'').replace(/\\/g,'\\\\').replace(/'/g,"\\'");}

/* ═══════════════════════════════════════════
   BOOTSTRAP
═══════════════════════════════════════════ */
window.addEventListener('fbReady',async()=>{
  const saved=localStorage.getItem('porra26');
  if(saved){
    try{
      const{user,isAdmin}=JSON.parse(saved);
      if(user){S.user=user;S.isAdmin=isAdmin||false;await initApp();return;}
    }catch(e){}
  }
  document.getElementById('auth-overlay').classList.remove('hidden');
},{once:true});

if(window._fbReady) window.dispatchEvent(new Event('fbReady'));

// Expose globals
Object.assign(window,{
  switchAuthTab,doLogin,doRegister,doLogout,saveAll,saveResults,
  switchTab,selectGroup,selectElimPhase,toggleTercero,
  setGroupScore,setElimScore,setPen,
  setChampion,setPremio,
  setAdminGroupScore,setAdminElimScore,setAdminPen,adminToggleTercero,setAdminResult,setTorneoState,
  adminSelectGroup,
});
</script>
