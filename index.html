<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>🏆 La Porra — Mundial 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#07090f;--surface:#0f1420;--card:#161d2e;--border:#1f2b44;
  --gold:#f0b429;--gold-dim:#8a6200;--gold-bg:rgba(240,180,41,.08);
  --green:#22c55e;--green-dim:#14532d;--green-bg:rgba(34,197,94,.07);
  --blue:#3b82f6;--red:#ef4444;--red-dim:#7f1d1d;
  --amber:#f59e0b;
  --txt:#e2e8f0;--txt-dim:#64748b;--radius:10px;
}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--txt);font-family:'Inter',sans-serif;font-size:14px;min-height:100dvh;-webkit-tap-highlight-color:transparent}
button{cursor:pointer;font-family:inherit;border:none;outline:none}
input,select,textarea{font-family:inherit;outline:none;border:none}

.hidden{display:none!important}
@keyframes spin{to{transform:rotate(360deg)}}

/* TOAST */
#toast{position:fixed;bottom:76px;left:50%;transform:translateX(-50%) translateY(80px);background:#1e293b;border:1px solid var(--border);border-radius:8px;padding:10px 18px;font-size:13px;font-weight:500;transition:transform .3s cubic-bezier(.34,1.56,.64,1);z-index:9999;white-space:nowrap;pointer-events:none}
#toast.show{transform:translateX(-50%) translateY(0)}
#toast.ok{border-color:var(--green);color:var(--green)}
#toast.err{border-color:var(--red);color:var(--red)}
#toast.warn{border-color:var(--amber);color:var(--amber)}

/* AUTH */
#auth-overlay{position:fixed;inset:0;z-index:1000;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:24px}
.auth-box{width:100%;max-width:360px;background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:36px 28px}
.auth-logo{text-align:center;margin-bottom:28px}
.auth-logo .trophy{font-size:48px;display:block;margin-bottom:8px}
.auth-logo h1{font-family:'Bebas Neue',sans-serif;font-size:28px;letter-spacing:2px;color:var(--gold)}
.auth-logo p{font-size:12px;color:var(--txt-dim);margin-top:4px}
.auth-tabs{display:flex;margin-bottom:24px;border-radius:8px;overflow:hidden;border:1px solid var(--border)}
.auth-tab{flex:1;padding:10px;background:transparent;color:var(--txt-dim);font-size:13px;font-weight:600;transition:all .2s}
.auth-tab.active{background:var(--gold);color:#07090f}
.field{margin-bottom:14px}
.field label{display:block;font-size:11px;font-weight:600;color:var(--txt-dim);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}
.field input{width:100%;background:var(--card);border:1px solid var(--border);border-radius:8px;padding:11px 14px;color:var(--txt);font-size:14px;transition:border-color .2s}
.field input:focus{border-color:var(--gold)}
.btn-primary{width:100%;padding:13px;border-radius:8px;background:var(--gold);color:#07090f;font-size:14px;font-weight:700;letter-spacing:.5px;transition:opacity .2s,transform .1s;margin-top:4px}
.btn-primary:hover{opacity:.9}
.btn-primary:active{transform:scale(.98)}
.btn-primary:disabled{opacity:.5;cursor:not-allowed}

/* APP */
#app{display:flex;flex-direction:column;min-height:100dvh}
.app-header{background:var(--surface);border-bottom:1px solid var(--border);padding:12px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.app-header h1{font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:2px;color:var(--gold)}
.header-right{display:flex;align-items:center;gap:8px}
.user-name{font-size:13px;font-weight:600;max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.admin-badge{background:rgba(240,180,41,.15);border:1px solid var(--gold-dim);color:var(--gold);padding:3px 8px;border-radius:5px;font-size:11px;font-weight:700}
.btn-logout{background:var(--card);border:1px solid var(--border);color:var(--txt-dim);padding:6px 10px;border-radius:6px;font-size:12px;transition:all .2s}
.btn-logout:hover{border-color:var(--red);color:var(--red)}

/* STATUS */
.status-bar{background:var(--surface);border-bottom:1px solid var(--border);padding:8px 16px;display:flex;align-items:center;gap:8px;font-size:12px;color:var(--txt-dim)}
.status-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.status-dot.open{background:var(--green);box-shadow:0 0 5px var(--green)}
.status-dot.closed{background:var(--red)}
.status-dot.live{background:var(--gold);animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

/* BOTTOM NAV */
.bottom-nav{position:sticky;bottom:0;z-index:100;background:var(--surface);border-top:1px solid var(--border);display:flex}
.nav-btn{flex:1;padding:10px 4px 8px;background:transparent;color:var(--txt-dim);display:flex;flex-direction:column;align-items:center;gap:3px;font-size:9px;font-weight:600;text-transform:uppercase;letter-spacing:.3px;transition:color .2s;border-top:2px solid transparent}
.nav-btn .icon{font-size:18px}
.nav-btn.active{color:var(--gold);border-top-color:var(--gold)}

/* MAIN */
.main-content{flex:1;padding:16px;max-width:720px;margin:0 auto;width:100%}
.section-header{margin-bottom:14px}
.section-header h2{font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:2px;color:var(--gold)}
.section-header p{font-size:12px;color:var(--txt-dim);margin-top:2px}

/* SAVE BAR */
.save-bar{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:10px 14px;display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:8px}
.progress-pill{font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;background:var(--card);border:1px solid var(--border);color:var(--txt-dim);white-space:nowrap}
.progress-pill.done{color:var(--green);border-color:var(--green-dim)}
.btn-save{background:var(--green);color:#fff;padding:7px 16px;border-radius:7px;font-size:13px;font-weight:700;transition:opacity .2s;white-space:nowrap;flex-shrink:0}
.btn-save:disabled{opacity:.4;cursor:not-allowed}
.locked-bar{background:rgba(239,68,68,.08);border:1px solid var(--red-dim);border-radius:var(--radius);padding:10px 14px;margin-bottom:14px;font-size:12px;color:#fca5a5;display:flex;align-items:center;gap:8px}

/* TIE-BREAK ALERT */
.tiebreak-alert{background:rgba(245,158,11,.08);border:1px solid rgba(245,158,11,.3);border-radius:var(--radius);padding:12px 14px;margin-bottom:10px;font-size:12px;color:#fcd34d}
.tiebreak-alert strong{display:block;margin-bottom:8px}
.tiebreak-team-btn{display:inline-flex;align-items:center;gap:5px;padding:5px 10px;margin:3px;border-radius:6px;border:1px solid rgba(245,158,11,.4);background:rgba(245,158,11,.06);color:#fcd34d;font-size:12px;font-weight:600;cursor:pointer;transition:all .15s}
.tiebreak-team-btn:hover,.tiebreak-team-btn.selected{border-color:var(--amber);background:rgba(245,158,11,.15)}

/* PHASE TABS */
.phase-tabs{display:flex;gap:4px;margin-bottom:12px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.phase-tabs::-webkit-scrollbar{display:none}
.phase-tab{padding:6px 12px;border-radius:7px;font-size:12px;font-weight:600;background:var(--card);border:1px solid var(--border);color:var(--txt-dim);white-space:nowrap;transition:all .15s;flex-shrink:0}
.phase-tab.active{background:var(--gold);color:#07090f;border-color:var(--gold)}

/* MATCH CARDS */
.match-list{display:flex;flex-direction:column;gap:8px}
.match-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
.match-card.hit-exact{border-color:var(--gold-dim);background:linear-gradient(135deg,rgba(240,180,41,.05),transparent)}
.match-card.hit-sign{border-color:rgba(34,197,94,.25)}
.match-header{background:var(--surface);padding:5px 12px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border)}
.match-label{font-size:10px;font-weight:700;color:var(--txt-dim);text-transform:uppercase;letter-spacing:.5px}
.match-pts-label{font-size:10px;font-weight:700;color:var(--gold)}
.match-real{font-size:10px;color:var(--txt-dim)}
.match-body{padding:10px 12px;display:flex;align-items:center;gap:8px}
.match-flag{font-size:22px;flex-shrink:0}
.match-name{flex:1;font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.match-name.home{text-align:right}
.match-name.away{text-align:left}
.score-wrap{display:flex;align-items:center;gap:6px;flex-shrink:0}
.score-box{width:42px;background:var(--surface);border:1px solid var(--border);border-radius:7px;padding:7px 4px;color:var(--txt);font-size:18px;font-weight:700;text-align:center;transition:border-color .2s}
.score-box:focus{border-color:var(--gold)}
.score-box:disabled{opacity:.5}
.score-sep{font-size:16px;font-weight:700;color:var(--txt-dim)}
.match-footer{padding:0 12px 8px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.pen-label{font-size:11px;color:var(--txt-dim);font-weight:600}
.pen-btn{padding:4px 10px;border-radius:5px;font-size:11px;font-weight:700;border:1px solid var(--border);background:var(--surface);color:var(--txt-dim);transition:all .15s}
.pen-btn.active{border-color:var(--gold);background:var(--gold-bg);color:var(--gold)}
.tbd-row{padding:9px 14px;display:flex;align-items:center;gap:8px;opacity:.4;font-size:13px;color:var(--txt-dim);border-top:1px solid var(--border)}

/* STANDINGS */
.standings-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;margin-bottom:10px}
.standings-header{background:var(--surface);padding:7px 12px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border)}
.standings-title{font-family:'Bebas Neue',sans-serif;font-size:15px;letter-spacing:1px;color:var(--gold)}
.standings-sub{font-size:10px;color:var(--txt-dim)}
.standings-table{width:100%;border-collapse:collapse;font-size:11px}
.standings-table td{padding:6px 8px;border-bottom:1px solid var(--border)}
.standings-table tr:last-child td{border-bottom:none}
.pos-badge{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:50%;font-size:10px;font-weight:700}
.pos-badge.p1{background:var(--gold);color:#07090f}
.pos-badge.p2{background:var(--green);color:#fff}
.pos-badge.p3{background:rgba(148,163,184,.25);color:var(--txt)}
.pos-badge.p4{background:rgba(239,68,68,.2);color:#fca5a5}
.q-badge{font-size:9px;font-weight:700;padding:1px 5px;border-radius:3px;margin-left:4px}
.q-badge.auto{background:rgba(34,197,94,.15);color:var(--green)}
.q-badge.tie{background:rgba(245,158,11,.15);color:var(--amber)}

/* TERCEROS */
.t3-info{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:10px}
.t3-info h3{font-size:12px;font-weight:700;color:var(--txt-dim);text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px}
.t3-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
@media(max-width:400px){.t3-grid{grid-template-columns:repeat(2,1fr)}}
.t3-chip{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:8px;text-align:center;font-size:11px}
.t3-chip .flag{font-size:20px;display:block;margin-bottom:3px}
.t3-chip .name{font-weight:600;line-height:1.2}
.t3-chip .grp{color:var(--txt-dim);font-size:10px}
.t3-chip .pos{font-size:10px;color:var(--txt-dim);margin-top:2px}
.t3-chip.rank1{border-color:var(--gold-dim)}
.t3-chip.rank2{border-color:rgba(34,197,94,.3)}

/* PREMIOS */
.premio-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:10px}
.premio-card h3{font-size:13px;font-weight:700;color:var(--gold);margin-bottom:2px;display:flex;align-items:center;justify-content:space-between}
.premio-pts{font-size:11px;padding:2px 7px;border-radius:4px;background:var(--surface);border:1px solid var(--border);color:var(--txt-dim)}
.premio-card p{font-size:11px;color:var(--txt-dim);margin-bottom:10px}
.text-input,.num-input{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:10px 12px;color:var(--txt);font-size:14px;transition:border-color .2s}
.text-input:focus,.num-input:focus{border-color:var(--gold)}
.text-input:disabled,.num-input:disabled{opacity:.5}
.champion-grid{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.champ-btn{display:inline-flex;align-items:center;gap:4px;padding:5px 9px;border-radius:6px;border:1px solid var(--border);background:var(--surface);color:var(--txt);font-size:12px;cursor:pointer;transition:all .15s}
.champ-btn.selected{border-color:var(--gold);background:var(--gold-bg);color:var(--gold);font-weight:700}
.champ-selected{display:flex;align-items:center;gap:8px;padding:10px;background:var(--gold-bg);border:1px solid var(--gold-dim);border-radius:8px;margin-bottom:8px;font-weight:700;color:var(--gold)}

/* CLASIFICACION */
.rank-list{display:flex;flex-direction:column;gap:6px}
.rank-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px;display:flex;align-items:center;gap:12px}
.rank-card.me{border-color:var(--gold-dim);background:var(--gold-bg)}
.rank-pos{font-family:'Bebas Neue',sans-serif;font-size:26px;color:var(--txt-dim);width:30px;text-align:center;flex-shrink:0;line-height:1}
.rank-pos.g{color:var(--gold)}
.rank-pos.s{color:#94a3b8}
.rank-pos.b{color:#cd7f32}
.rank-info{flex:1;min-width:0}
.rank-name{font-size:14px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rank-sub{font-size:11px;color:var(--txt-dim);margin-top:2px}
.rank-pts-wrap{text-align:right;flex-shrink:0}
.rank-pts{font-size:22px;font-weight:700;color:var(--gold);display:block;line-height:1}
.rank-pts-label{font-size:10px;color:var(--txt-dim);font-weight:600;text-transform:uppercase}
.me-badge{font-size:10px;font-weight:700;color:var(--gold);border:1px solid var(--gold-dim);border-radius:4px;padding:1px 5px;margin-left:6px}

/* ADMIN */
.admin-section{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:10px}
.admin-section h3{font-size:13px;font-weight:700;color:var(--gold);margin-bottom:12px}
.admin-row{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--border)}
.admin-row:last-child{border-bottom:none}
.admin-info{flex:1;min-width:0}
.admin-match-name{font-size:12px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.admin-match-sub{font-size:10px;color:var(--txt-dim);margin-top:1px}
.admin-score{width:38px;background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:5px 4px;color:var(--txt);font-size:16px;font-weight:700;text-align:center}
.admin-score:focus{border-color:var(--gold)}
.admin-sep{font-size:14px;color:var(--txt-dim)}
.admin-save{background:var(--green);color:#fff;padding:6px 14px;border-radius:6px;font-size:12px;font-weight:700;margin-top:10px}
.btn-state{padding:7px 12px;border-radius:7px;font-size:12px;font-weight:700;border:1px solid;transition:all .2s;margin-right:6px;margin-bottom:6px}
.btn-state.open{background:rgba(34,197,94,.1);border-color:var(--green);color:var(--green)}
.btn-state.closed{background:rgba(239,68,68,.1);border-color:var(--red);color:var(--red)}
.btn-state.live{background:rgba(240,180,41,.1);border-color:var(--gold);color:var(--gold)}
.t3-reorder{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.t3-reorder-item{display:flex;align-items:center;gap:5px;padding:5px 10px;border-radius:6px;border:1px solid var(--border);background:var(--surface);font-size:12px;cursor:grab}
.btn-reset{padding:6px 12px;border-radius:6px;font-size:12px;font-weight:700;border:1px solid var(--red-dim);background:rgba(239,68,68,.08);color:#fca5a5;cursor:pointer;transition:all .2s}
.btn-reset:hover{background:rgba(239,68,68,.18);border-color:var(--red)}
.reset-section{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:10px}
.reset-section h3{font-size:13px;font-weight:700;color:var(--red);margin-bottom:12px}
.reset-grid{display:flex;flex-wrap:wrap;gap:8px}

.empty-state{text-align:center;padding:40px 20px;color:var(--txt-dim);font-size:13px}
.empty-state .icon{font-size:36px;display:block;margin-bottom:8px;opacity:.5}
.jornada-label{font-size:11px;font-weight:700;color:var(--txt-dim);text-transform:uppercase;letter-spacing:.5px;margin:10px 0 6px}

/* PREDS VIEWER MODAL */
.preds-modal{position:fixed;inset:0;z-index:500;background:rgba(0,0,0,.75);display:flex;align-items:flex-start;justify-content:center;padding:16px;overflow-y:auto}
.preds-modal-box{background:var(--surface);border:1px solid var(--border);border-radius:16px;width:100%;max-width:640px;overflow:hidden;margin:auto}
.preds-modal-header{background:var(--card);padding:14px 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:10}
.preds-modal-title{font-family:'Bebas Neue',sans-serif;font-size:18px;letter-spacing:1.5px;color:var(--gold)}
.preds-modal-close{background:var(--surface);border:1px solid var(--border);color:var(--txt-dim);width:30px;height:30px;border-radius:50%;font-size:16px;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0}
.preds-modal-body{padding:14px;max-height:80vh;overflow-y:auto}
.preds-section{margin-bottom:14px}
.preds-section h3{font-size:11px;font-weight:700;color:var(--txt-dim);text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px}
.preds-group-row{display:flex;align-items:center;gap:8px;padding:5px 10px;background:var(--card);border-radius:8px;margin-bottom:4px;font-size:12px}
.preds-group-label{font-weight:700;color:var(--gold);width:20px;flex-shrink:0}
.preds-elim-row{display:flex;align-items:center;gap:6px;padding:5px 10px;background:var(--card);border-radius:8px;margin-bottom:3px;font-size:11px}
.preds-elim-label{color:var(--txt-dim);min-width:90px;flex-shrink:0}
.preds-hit{color:var(--green);font-weight:700}
.preds-miss{color:var(--red)}
.preds-unknown{color:var(--txt-dim);font-style:italic}

/* PARTICIPANTS LIST */
.participant-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:11px 14px;display:flex;align-items:center;gap:10px;margin-bottom:6px}
.participant-card.me{border-color:var(--gold-dim);background:var(--gold-bg)}
.participant-avatar{width:34px;height:34px;border-radius:50%;background:var(--surface);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:var(--txt-dim);flex-shrink:0;text-transform:uppercase}
.participant-info{flex:1;min-width:0}
.participant-name{font-size:13px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.participant-sub{font-size:11px;color:var(--txt-dim);margin-top:2px;display:flex;align-items:center;gap:6px}
.progress-bar-outer{background:var(--border);border-radius:3px;height:4px;flex:1;overflow:hidden;margin-top:4px}
.progress-bar-inner{height:100%;background:var(--gold);border-radius:3px;transition:width .4s ease}
.progress-bar-inner.full{background:var(--green)}
.paid-badge{display:inline-flex;align-items:center;gap:3px;font-size:10px;font-weight:700;padding:2px 7px;border-radius:4px;flex-shrink:0}
.paid-badge.yes{background:rgba(34,197,94,.15);border:1px solid var(--green-dim);color:var(--green)}
.paid-badge.no{background:rgba(239,68,68,.08);border:1px solid var(--red-dim);color:#fca5a5}
.paid-toggle{background:none;border:none;padding:0;cursor:pointer;font-size:18px;flex-shrink:0;line-height:1}
.clasif-tabs{display:flex;gap:6px;margin-bottom:14px}
.clasif-tab{padding:6px 14px;border-radius:7px;font-size:12px;font-weight:600;background:var(--card);border:1px solid var(--border);color:var(--txt-dim);cursor:pointer;transition:all .15s}
.clasif-tab.active{background:var(--gold);color:#07090f;border-color:var(--gold)}
.participants-summary{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px;margin-bottom:12px;display:flex;gap:16px;flex-wrap:wrap}
.participants-summary .stat{text-align:center}

<div id="auth-overlay" class="hidden">
  <div class="auth-box">
    <div class="auth-logo"><span class="trophy">🏆</span><h1>La Porra</h1><p>Mundial USA · Canadá · México 2026</p></div>
    <div class="auth-tabs">
      <button class="auth-tab active" onclick="switchAuthTab('login')">Entrar</button>
      <button class="auth-tab" onclick="switchAuthTab('register')">Registrarse</button>
    </div>
    <div id="form-login">
      <div class="field"><label>Nombre</label><input type="text" id="l-name" placeholder="Tu nombre" autocomplete="username"></div>
      <div class="field"><label>Contraseña</label><input type="password" id="l-pass" placeholder="••••••" autocomplete="current-password"></div>
      <button class="btn-primary" onclick="doLogin()">Entrar</button>
    </div>
    <div id="form-register" class="hidden">
      <div class="field"><label>Nombre</label><input type="text" id="r-name" placeholder="Cómo te llaman" autocomplete="username"></div>
      <div class="field"><label>Contraseña</label><input type="password" id="r-pass" placeholder="Mínimo 6 caracteres" autocomplete="new-password"></div>
      <button class="btn-primary" onclick="doRegister()">Crear cuenta</button>
    </div>
  </div>
</div>

<div id="app" class="hidden">
  <header class="app-header">
    <h1>🏆 La Porra 2026</h1>
    <div class="header-right">
      <span id="header-name" class="user-name"></span>
      <span id="admin-badge" class="admin-badge hidden">ADMIN</span>
      <button class="btn-logout" onclick="doLogout()">Salir</button>
    </div>
  </header>
  <div id="status-bar" class="status-bar hidden">
    <div id="status-dot" class="status-dot"></div>
    <span id="status-text"></span>

</div>

// qualifying8: sorted array of 8 group letters
// t3Map: {groupLetter: teamName}
function resolveT3Assignments(qualifying8, t3Map){
  const key=[...qualifying8].sort().join('');
  const assignment=COMBO_MAP[key];
  const result={};
  if(!assignment) return result;
  // assignment[i] = group letter whose 3rd is opponent for slot i

  assignment.forEach((grpLetter,i)=>{

  });
  return result;
}

function hashPass(p){let h=0;for(let i=0;i<p.length;i++)h=Math.imul(31,h)+p.charCodeAt(i)|0;return h.toString(36);}

async function doLogin(){
  const name=document.getElementById('l-name').value.trim();
  const pass=document.getElementById('l-pass').value;
  if(!name||!pass){toast('Rellena todos los campos','err');return;}
  if(name===ADMIN_USER&&pass===ADMIN_PASS){S.user=ADMIN_USER;S.isAdmin=true;localStorage.setItem('p26',JSON.stringify({user:ADMIN_USER,isAdmin:true}));await boot();return;}
  const btn=document.querySelector('#form-login .btn-primary');

    await boot();
  }catch(e){toast('Error: '+e.message,'err');}

async function boot(){
  const cfg=await fbGet('config','torneo');
  S.torneoState=cfg?.state||'open';
  const res=await fbGet('config','results');
  if(res){S.results={...S.results,...res};}
  if(!S.isAdmin){
    const ud=await fbGet('users',S.user.toLowerCase());
    if(ud?.preds){
      S.preds={...S.preds,...ud.preds};
      // Strip cached homeTeam/awayTeam — always recalculate fresh from group standings
      // Also sanitize any undefined values that may have slipped in previously
      if(S.preds.elim){
        Object.keys(S.preds.elim).forEach(k=>{
          const e=S.preds.elim[k];
          S.preds.elim[k]={
            home:e.home??null,
            away:e.away??null,
            pen:e.pen??null
            // homeTeam/awayTeam intentionally omitted — recalculated fresh
          };
        });
      }
      // Sanitize groups too
      if(S.preds.groups){
        Object.keys(S.preds.groups).forEach(k=>{
          const g=S.preds.groups[k];
          S.preds.groups[k]={
            home:g.home??null,
            away:g.away??null
          };
        });
      }
    }
  }
  document.getElementById('auth-overlay').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  document.getElementById('header-name').textContent=S.user;
  document.getElementById('admin-badge').classList.toggle('hidden',!S.isAdmin);
  if(S.isAdmin) document.getElementById('nav-admin').classList.remove('hidden');
  updateStatusBar();
  switchTab('grupos');
  subscribeRT();
}

/* ══════════════════════════════════════════════════════════
   SAVE
══════════════════════════════════════════════════════════ */
function sanitizeForFirebase(obj){
  // Recursively replace undefined with null — Firestore rejects undefined values
  if(obj===undefined) return null;
  if(obj===null||typeof obj!=='object') return obj;
  if(Array.isArray(obj)) return obj.map(sanitizeForFirebase);
  const out={};
  for(const k of Object.keys(obj)){
    out[k]=sanitizeForFirebase(obj[k]);
  }
  return out;
}

  if(isLocked()){toast('Pronósticos cerrados','err');return;}
  const btn=document.getElementById('btn-save');

  try{
    // Strip homeTeam/awayTeam from elim before saving — always recalculated fresh on load
    const predsToSave=sanitizeForFirebase({
      ...S.preds,
      elim:Object.fromEntries(
        Object.entries(S.preds.elim||{}).map(([k,v])=>[k,{
          home:v.home??null,
          away:v.away??null,

        }])

    });

    toast('✅ Guardado');updateProgress();

function updateProgress(){
  const gDone=GROUP_MATCHES.filter(m=>{const r=S.preds.groups[m.id];return r&&r.home!==''&&r.home!==null&&r.away!==''&&r.away!==null;}).length;
  const eDone=ELIM_PHASES.reduce((a,ph)=>a+ph.matches.filter(m=>{const r=S.preds.elim[m.id];return r&&r.home!==''&&r.home!==null&&r.away!==''&&r.away!==null;}).length,0);
  const pDone=(S.preds.balon?1:0)+(S.preds.maxGolEsp?1:0)+(S.preds.mejorJoven?1:0)+(S.preds.maxGolesGol!==''&&S.preds.maxGolesGol!==null&&S.preds.maxGolesGol!==undefined?1:0)+(S.preds.champion?1:0);
  const total=GROUP_MATCHES.length+ELIM_PHASES.reduce((a,ph)=>a+ph.matches.length,0)+5;
  const pct=Math.round((gDone+eDone+pDone)/total*100);
  const pill=document.getElementById('progress-pill');
  if(pill){pill.textContent=pct+'%';pill.classList.toggle('done',pct===100);}
}

/* ══════════════════════════════════════════════════════════
   GROUP STANDINGS ENGINE
══════════════════════════════════════════════════════════ */
function computeStandings(groupKey, matchData, tiebreaks){
  const teams=GROUPS[groupKey];
  const tbl={};
  teams.forEach(t=>{tbl[t]={pts:0,j:0,g:0,e:0,p:0,gf:0,gc:0,dg:0};});
  GROUP_MATCHES.filter(m=>m.group===groupKey).forEach(m=>{
    const r=matchData[m.id];
    if(!r||r.home===''||r.home===null||r.home===undefined||r.away===''||r.away===null||r.away===undefined) return;
    const h=parseInt(r.home),a=parseInt(r.away);
    if(isNaN(h)||isNaN(a)) return;
    tbl[m.home].j++;tbl[m.away].j++;
    tbl[m.home].gf+=h;tbl[m.home].gc+=a;tbl[m.home].dg+=h-a;
    tbl[m.away].gf+=a;tbl[m.away].gc+=h;tbl[m.away].dg+=a-h;
    if(h>a){tbl[m.home].g++;tbl[m.home].pts+=3;tbl[m.away].p++;}
    else if(a>h){tbl[m.away].g++;tbl[m.away].pts+=3;tbl[m.home].p++;}
    else{tbl[m.home].e++;tbl[m.home].pts++;tbl[m.away].e++;tbl[m.away].pts++;}
  });

  let rows=Object.entries(tbl).map(([name,s])=>({name,...s}));

  // Sort with tie-break detection
  rows.sort((a,b)=>{
    if(b.pts!==a.pts) return b.pts-a.pts;
    if(b.dg!==a.dg) return b.dg-a.dg;
    if(b.gf!==a.gf) return b.gf-a.gf;
    // Tied on all 3 — check manual tiebreak
    const tbKey=`grp_${groupKey}`;
    const tb=(tiebreaks||{})[tbKey];
    if(tb&&tb.indexOf(a.name)!==-1&&tb.indexOf(b.name)!==-1){
      return tb.indexOf(a.name)-tb.indexOf(b.name);
    }
    return a.name.localeCompare(b.name); // fallback alphabetical
  });

  // Detect ties requiring user input
  rows=rows.map((r,i)=>({...r,pos:i+1}));
  const tiedGroups=[];
  for(let i=0;i<rows.length-1;i++){
    const a=rows[i],b=rows[i+1];
    if(a.pts===b.pts&&a.dg===b.dg&&a.gf===b.gf){
      const tbKey=`grp_${groupKey}`;
      const tb=(tiebreaks||{})[tbKey];
      const resolved=tb&&tb.indexOf(a.name)!==-1&&tb.indexOf(b.name)!==-1;
      if(!resolved) tiedGroups.push({key:tbKey,teams:rows.filter(r=>rows[i].pts===r.pts&&rows[i].dg===r.dg&&rows[i].gf===r.gf).map(r=>r.name)});
    }
  }

  return{standings:rows,ties:tiedGroups};
}

// Get all 12 thirds ranked — returns sorted array with tie info
function computeAllThirds(matchData, tiebreaks){
  const thirds=[];
  for(const g of Object.keys(GROUPS)){
    const{standings}=computeStandings(g,matchData,tiebreaks);
    if(standings[2]) thirds.push({team:standings[2].name,group:g,...standings[2]});
  }
  thirds.sort((a,b)=>{
    if(b.pts!==a.pts) return b.pts-a.pts;
    if(b.dg!==a.dg) return b.dg-a.dg;
    if(b.gf!==a.gf) return b.gf-a.gf;
    const tbKey='t3_ranking';
    const tb=(tiebreaks||{})[tbKey];
    if(tb){
      const ia=tb.indexOf(a.team),ib=tb.indexOf(b.team);
      if(ia!==-1&&ib!==-1) return ia-ib;
    }
    return a.team.localeCompare(b.team);
  });
  return thirds;
}

// Returns sorted 8 qualifying thirds
function getTop8Thirds(matchData,tiebreaks){
  const all=computeAllThirds(matchData,tiebreaks);
  return all.slice(0,8);
}

// Get T3 match assignments for a given dataset
function computeT3Assignments(matchData,tiebreaks){
  const top8=getTop8Thirds(matchData,tiebreaks);
  if(top8.length<8) return {};
  const qualifying8=top8.map(t=>t.group);
  const t3Map={};
  top8.forEach(t=>{t3Map[t.group]=t.team;});
  return resolveT3Assignments(qualifying8,t3Map);
}

/* ══════════════════════════════════════════════════════════
   ELIMINATION ENGINE — resolve team from code
══════════════════════════════════════════════════════════ */
function resolveCode(code, matchData, tiebreaks, elimData){
  if(!code) return null;
  // Group winner/runner-up
  if(/^[12][A-L]$/.test(code)){
    const pos=parseInt(code[0]),g=code[1];
    const{standings}=computeStandings(g,matchData,tiebreaks);
    return standings[pos-1]?.name||null;
  }
  // Third-place slot
  if(code.startsWith('T3_')){
    const assignments=computeT3Assignments(matchData,tiebreaks);
    // Find which match this slot corresponds to
    // code like 'T3_ABCDF' → we need to find what match slot this is
    // Actually: T3 codes in R32 are just labels; the actual team comes from COMBO_MAP lookup
    // We need to find the match that has this as away, then look up assignments
    for(const m of R32){
      if(m.away===code){
        return assignments[m.id]||null;
      }
    }
    return null;
  }
  // Elim winner
  if(code.endsWith('_loser')){
    const mid=code.replace('_loser','');
    return getElimResult(mid,elimData,'loser');
  }
  return getElimResult(code,elimData,'winner');
}

function getElimResult(matchId, elimData, which){
  const r=(elimData||{})[matchId];
  if(!r||r.home===''||r.home===null||r.away===''||r.away===null) return null;
  const h=parseInt(r.home),a=parseInt(r.away);
  if(isNaN(h)||isNaN(a)) return null;
  let winner,loser;
  if(h>a){winner=r.homeTeam;loser=r.awayTeam;}
  else if(a>h){winner=r.awayTeam;loser=r.homeTeam;}
  else{
    if(r.pen==='home'){winner=r.homeTeam;loser=r.awayTeam;}
    else if(r.pen==='away'){winner=r.awayTeam;loser=r.homeTeam;}
    else return null;
  }
  return which==='winner'?winner:loser;
}

function getSign(r){
  if(!r||r.home===''||r.home===null||r.away===''||r.away===null) return null;
  const h=parseInt(r.home),a=parseInt(r.away);
  if(isNaN(h)||isNaN(a)) return null;
  return h>a?'1':a>h?'2':'X';
}

function scorePoints(pred,real){
  if(!pred||!real) return 0;
  const ph=pred.home,pa=pred.away,rh=real.home,ra=real.away;
  // Strict check — reject any undefined, null, empty string or NaN
  if(ph===''||ph===null||ph===undefined||pa===''||pa===null||pa===undefined) return 0;
  if(rh===''||rh===null||rh===undefined||ra===''||ra===null||ra===undefined) return 0;
  if(isNaN(parseInt(ph))||isNaN(parseInt(pa))||isNaN(parseInt(rh))||isNaN(parseInt(ra))) return 0;
  let p=0;
  if(getSign(pred)&&getSign(real)&&getSign(pred)===getSign(real)) p+=PTS.sign;
  if(String(ph)===String(rh)&&String(pa)===String(ra)) p+=PTS.exact;
  return p;
}

    html+=`<div class="tiebreak-alert">
    <strong>⚠️ Empate en fair play — ¿en qué orden quedarían?</strong>

  [1,2,3].forEach(j=>{

    html+=`<div class="jornada-label">Jornada ${j}</div><div class="match-list">`;

      const isExact=real&&String(pred.home)===String(real.home)&&String(pred.away)===String(real.away);
      const isSign=real&&getSign(pred)&&getSign(pred)===getSign(real);
      const pts=real?scorePoints(pred,real):0;
      html+=`<div class="match-card${isExact?' hit-exact':isSign?' hit-sign':''}">
      <div class="match-header">
        <span class="match-label">${m.label}</span>
        ${pts>0?`<span class="match-pts-label">+${pts} pts</span>`:''}
        ${real&&real.home!==''&&real.home!==null?`<span class="match-real">Real: ${real.home}–${real.away}</span>`:''}
      </div>
      <div class="match-body">
        <span class="match-flag">${fl(m.home)}</span>
        <span class="match-name home">${m.home}</span>
        <div class="score-wrap">
          <input class="score-box" type="number" min="0" max="20" value="${pred.home===''||pred.home===null||pred.home===undefined?'':pred.home}" ${locked?'disabled':''}
            oninput="setGroupScore('${m.id}','home',this.value,'${g}')">
          <span class="score-sep">–</span>
          <input class="score-box" type="number" min="0" max="20" value="${pred.away===''||pred.away===null||pred.away===undefined?'':pred.away}" ${locked?'disabled':''}

        </div>
        <span class="match-name away">${m.away}</span>
        <span class="match-flag">${fl(m.away)}</span>
      </div>
      </div>`;
    });
    html+=`</div>`;
  });

  document.getElementById('group-content').innerHTML=html;
}

function renderThirdsPanel(){
  const top8=getTop8Thirds(S.preds.groups,S.preds.tiebreaks);
  const all=computeAllThirds(S.preds.groups,S.preds.tiebreaks);
  const assignments=computeT3Assignments(S.preds.groups,S.preds.tiebreaks);
  
  // Check if there are t3 tiebreaks needed
  const tiedT3=[];
  for(let i=0;i<all.length-1;i++){
    const a=all[i],b=all[i+1];
    if(a.pts===b.pts&&a.dg===b.dg&&a.gf===b.gf){
      const tb=(S.preds.tiebreaks||{})['t3_ranking'];
      if(!tb||tb.indexOf(a.team)===-1||tb.indexOf(b.team)===-1){
        tiedT3.push(a.team,b.team);
      }
    }
  }
  
  let html='';

  if(tiedT3.length>0){
    const uniqTied=[...new Set(tiedT3)];
    const current=(S.preds.tiebreaks||{})['t3_ranking']||[];
    html+=`<div class="tiebreak-alert">
    <strong>⚠️ Empate entre terceros — ¿en qué orden quedarían?</strong>
    <p style="font-size:11px;margin-bottom:8px">Estos terceros están empatados. Indica el orden en que quedarían en el ranking de mejores terceros:</p>
    <div>`;
    uniqTied.forEach(team=>{
      const pos=current.indexOf(team);
      html+=`<button class="tiebreak-team-btn${pos!==-1?' selected':''}" onclick="setT3Tiebreak('${esc(team)}')">
        ${pos!==-1?`${pos+1}. `:''}${fl(team)} ${team}
      </button>`;
    });
    html+=`</div></div>`;
  }

  if(top8.length===0){
    html+=`<div class="t3-info"><h3>Mejores Terceros</h3><p style="font-size:12px;color:var(--txt-dim)">Introduce los marcadores de grupos para ver los mejores terceros.</p></div>`;
    return html;
  }

  html+=`<div class="t3-info"><h3>Mejores Terceros — clasificación automática</h3>
  <p style="font-size:11px;color:var(--txt-dim);margin-bottom:10px">Calculado de tus pronósticos. Los 8 primeros clasifican.</p>
  <div class="t3-grid">`;
  all.forEach((t,i)=>{
    const qualifies=i<8;
    html+=`<div class="t3-chip${qualifies?(i<4?' rank1':' rank2'):''}">
      <span class="flag">${fl(t.team)}</span>
      <div class="name">${t.team}</div>
      <div class="grp">Grupo ${t.group}</div>
      <div class="pos">${qualifies?`#${i+1} ✓`:`#${i+1} ✗`}</div>
    </div>`;
  });
  html+=`</div>`;

  if(top8.length===8){
    html+=`<div style="margin-top:12px;font-size:11px;font-weight:700;color:var(--txt-dim);text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px">Asignación al cuadro (FIFA Annex C):</div>`;

    </div>`;
    return;
  }
  const phObj=ELIM_PHASES.find(p=>p.phase===S.currentElimPhase);
  if(!phObj){ec.innerHTML='';return;}
  const locked=isLocked();
  let html=`<div class="match-list">`;
  phObj.matches.forEach(m=>{
    const pred=S.preds.elim[m.id]||{};
    const real=S.results.elim?.[m.id];

    // Always recalculate teams fresh from group standings — never trust cached values
    let homeTeam=null;
    let awayTeam=null;
    // Helper to resolve srcA/srcB codes including _loser suffix
    const resolveSrc=(src)=>{
      if(!src) return null;
      if(src.endsWith('_loser')) return getElimResult(src.replace('_loser',''),S.preds.elim,'loser');
      return getElimResult(src,S.preds.elim,'winner');
    };
    if(m.home) homeTeam=resolveCode(m.home,S.preds.groups,S.preds.tiebreaks,S.preds.elim);
    else if(m.srcA) homeTeam=resolveSrc(m.srcA);
    if(m.away&&!m.away.startsWith('T3_')) awayTeam=resolveCode(m.away,S.preds.groups,S.preds.tiebreaks,S.preds.elim);
    else if(m.away&&m.away.startsWith('T3_')){
      const assignments=computeT3Assignments(S.preds.groups,S.preds.tiebreaks);
      awayTeam=assignments[m.id]||null;
    }
    if(!awayTeam&&m.srcB) awayTeam=resolveSrc(m.srcB);
    // Store resolved teams so score inputs can reference them
    if(!S.preds.elim[m.id]) S.preds.elim[m.id]={home:'',away:'',pen:null};

    const av=pred.away!==''&&pred.away!==null&&pred.away!==undefined?pred.away:'';
    const sign=getSign(pred);

    const isSign=real&&sign&&sign===getSign(real);
    const pts=real?scorePoints(pred,real):0;
    const phasePts=phObj.pts;
    const realWinner=real?getElimResult(m.id,S.results.elim,'winner'):null;
    const predWinner=getElimResult(m.id,S.preds.elim,'winner');
    const clasifHit=realWinner&&predWinner&&realWinner===predWinner;

    html+=`<div class="match-card${isExact?' hit-exact':isSign?' hit-sign':''}">
    <div class="match-header">
      <span class="match-label">${m.label}${phasePts>0?` · ${phasePts} pts/clasif.`:''}</span>
      ${pts>0?`<span class="match-pts-label">+${pts}${clasifHit?'+'+phasePts:''} pts</span>`:(clasifHit?`<span class="match-pts-label">+${phasePts} pts</span>`:'')}

    </div>
    <div class="match-body">
      <span class="match-flag">${homeTeam?fl(homeTeam):'❓'}</span>
      <span class="match-name home">${homeTeam||'Por definir'}</span>
      <div class="score-wrap">
        <input class="score-box" type="number" min="0" max="20" value="${hv}" ${locked||!homeTeam||!awayTeam?'disabled':''}
          oninput="setElimScore('${m.id}','home',this.value,'${esc(homeTeam||'')}','${esc(awayTeam||'')}')">
        <span class="score-sep">–</span>
        <input class="score-box" type="number" min="0" max="20" value="${av}" ${locked||!homeTeam||!awayTeam?'disabled':''}
          oninput="setElimScore('${m.id}','away',this.value,'${esc(homeTeam||'')}','${esc(awayTeam||'')}')">

      <span class="match-name away">${awayTeam||'Por definir'}</span>
      <span class="match-flag">${awayTeam?fl(awayTeam):'❓'}</span>

    if(isDraw&&homeTeam&&awayTeam&&!locked){
      const ph=pred.pen==='home',pa=pred.pen==='away';
      html+=`<div class="match-footer">
        <span class="pen-label">Penaltis — ¿quién clasifica?</span>
        <button class="pen-btn${ph?' active':''}" onclick="setPen('pred','${m.id}','home')">${fl(homeTeam)} ${homeTeam}</button>

    } else if(isDraw&&(!homeTeam||!awayTeam)&&!locked){
      html+=`<div class="match-footer"><span style="font-size:11px;color:var(--amber)">⚠️ Empate — define antes los partidos anteriores para elegir penaltis</span></div>`;
    } else if(isDraw&&locked&&(pred.pen==='home'||pred.pen==='away')){
      const penWinner=pred.pen==='home'?homeTeam:awayTeam;
      html+=`<div class="match-footer"><span style="font-size:11px;color:var(--gold)">🏆 Clasifica en penaltis: <strong>${penWinner||'?'}</strong></span></div>`;
    }
    html+=`</div>`;
  });
  html+=`</div>`;
  ec.innerHTML=html;

/* ══════════════════════════════════════════════════════════
   USER ELIM TEAM RESOLVER (for scoring)
   Recalculates which teams appear in each elim match from
   the user's group predictions — never relies on stored homeTeam/awayTeam
══════════════════════════════════════════════════════════ */
const _ALL_ELIM_MATCHES=[...R32,...R16,...QF,...SF,...FINAL,...P34];

function resolveUserElimMatch(matchId, preds){
  const matchDef=_ALL_ELIM_MATCHES.find(m=>m.id===matchId);
  if(!matchDef) return{homeTeam:null,awayTeam:null,winner:null,loser:null};
  const r=(preds.elim||{})[matchId];

  // Recursive helper: get winner/loser of a source match from user preds
  const resolveSrc=(src)=>{
    if(!src) return null;
    if(src.endsWith('_loser')){
      const dep=resolveUserElimMatch(src.replace('_loser',''),preds);
      return dep?.loser||null;
    }
    const dep=resolveUserElimMatch(src,preds);
    return dep?.winner||null;
  };

  let homeTeam=null,awayTeam=null;
  // Resolve home team
  if(matchDef.home){
    homeTeam=resolveCode(matchDef.home,preds.groups||{},preds.tiebreaks||{},preds.elim||{});
  } else if(matchDef.srcA){
    homeTeam=resolveSrc(matchDef.srcA);
  }
  // Resolve away team
  if(matchDef.away&&!matchDef.away.startsWith('T3_')){
    awayTeam=resolveCode(matchDef.away,preds.groups||{},preds.tiebreaks||{},preds.elim||{});
  } else if(matchDef.away&&matchDef.away.startsWith('T3_')){
    const asgn=computeT3Assignments(preds.groups||{},preds.tiebreaks||{});
    awayTeam=asgn[matchId]||null;
  }
  if(!awayTeam&&matchDef.srcB) awayTeam=resolveSrc(matchDef.srcB);

  // If no score recorded, return teams without winner
  if(!r||r.home===''||r.home===null||r.home===undefined||r.away===''||r.away===null||r.away===undefined){
    return{homeTeam,awayTeam,winner:null,loser:null};
  }
  const h=parseInt(r.home),a=parseInt(r.away);
  if(isNaN(h)||isNaN(a)) return{homeTeam,awayTeam,winner:null,loser:null};

  let winner=null,loser=null;
  if(h>a){winner=homeTeam;loser=awayTeam;}
  else if(a>h){winner=awayTeam;loser=homeTeam;}
  else if(r.pen==='home'){winner=homeTeam;loser=awayTeam;}
  else if(r.pen==='away'){winner=awayTeam;loser=homeTeam;}

  return{homeTeam,awayTeam,winner,loser};
}

/* ══════════════════════════════════════════════════════════
   SCORING ENGINE
══════════════════════════════════════════════════════════ */
// Returns true if a group has at least 1 real result entered
function groupHasResults(g, rGroups){
  return GROUP_MATCHES.filter(m=>m.group===g).some(m=>{
    const r=rGroups[m.id];
    return r&&r.home!==''&&r.home!==null&&r.home!==undefined&&r.away!==''&&r.away!==null&&r.away!==undefined;
  });
}
// Returns true if ALL 6 matches of a group have real results
function groupIsComplete(g, rGroups){
  return GROUP_MATCHES.filter(m=>m.group===g).every(m=>{
    const r=rGroups[m.id];
    return r&&r.home!==''&&r.home!==null&&r.home!==undefined&&r.away!==''&&r.away!==null&&r.away!==undefined;
  });
}

function calcScore(preds,results){
  let pts=0;
  const breakdown={};
  if(!preds||!results) return{pts,breakdown};

  const rGroups=results.groups||{};
  const rElim=results.elim||{};

  // ── Group match points (only if that specific match has a real result) ──
  GROUP_MATCHES.forEach(m=>{
    const pr=preds.groups?.[m.id],re=rGroups[m.id];
    if(!re||re.home===''||re.home===null||re.home===undefined||re.away===''||re.away===null||re.away===undefined) return;
    if(!pr||pr.home===''||pr.home===null||pr.home===undefined||pr.away===''||pr.away===null||pr.away===undefined) return;
    const p=scorePoints(pr,re);
    if(p>0){pts+=p;breakdown[m.id]=p;}
  });

  // ── Group position + qualification (only when ALL 6 matches of a group are done) ──
  Object.keys(GROUPS).forEach(g=>{
    if(!groupIsComplete(g,rGroups)) return; // skip entirely if group not finished
    const{standings:pStand}=computeStandings(g,preds.groups||{},preds.tiebreaks||{});
    const{standings:rStand}=computeStandings(g,rGroups,results.tiebreaks||{});
    // pos1 exact
    if(rStand[0]?.name&&pStand[0]?.name&&rStand[0].name===pStand[0].name){pts+=PTS.pos1;breakdown[`pos1_${g}`]=PTS.pos1;}
    // pos2 exact
    if(rStand[1]?.name&&pStand[1]?.name&&rStand[1].name===pStand[1].name){pts+=PTS.pos2;breakdown[`pos2_${g}`]=PTS.pos2;}
  });

  // ── Qualification to R32 (only when ALL 12 groups are complete) ──
  const allGroupsDone=Object.keys(GROUPS).every(g=>groupIsComplete(g,rGroups));
  if(allGroupsDone){
    const rt8=getTop8Thirds(rGroups,results.tiebreaks||{}).map(t=>t.team);
    Object.keys(GROUPS).forEach(g=>{
      const{standings:rStand}=computeStandings(g,rGroups,results.tiebreaks||{});
      const realQual=new Set([rStand[0]?.name,rStand[1]?.name,...rt8].filter(Boolean));
      // Check predicted top-2
      const{standings:pStand}=computeStandings(g,preds.groups||{},preds.tiebreaks||{});
      [pStand[0]?.name,pStand[1]?.name].filter(Boolean).forEach(team=>{
        if(realQual.has(team)&&!breakdown[`qual_${team}`]){pts+=PTS.qual;breakdown[`qual_${team}`]=PTS.qual;}
      });
      // Check predicted thirds
      const pt8=getTop8Thirds(preds.groups||{},preds.tiebreaks||{}).map(t=>t.team);
      pt8.forEach(team=>{
        if(realQual.has(team)&&!breakdown[`qual_${team}`]){pts+=PTS.qual;breakdown[`qual_${team}`]=PTS.qual;}
      });
    });
  }

  // ── Elim match points + classification ──
  ELIM_PHASES.forEach(({phase,pts:phasePts,matches})=>{
    matches.forEach(m=>{
      const pr=preds.elim?.[m.id],re=rElim[m.id];
      // Match score points — only if real result exists with valid scores
      if(re&&re.home!==''&&re.home!==null&&re.home!==undefined&&
         re.away!==''&&re.away!==null&&re.away!==undefined&&pr){
        const p=scorePoints(pr,re);
        if(p>0){pts+=p;breakdown[m.id+'_s']=p;}
      }
      // Classification points — recalculate teams from user's group preds
      // (never rely on stored homeTeam/awayTeam which are stripped on save)
      if(phasePts>0){
        const rW=getElimResult(m.id,rElim,'winner');
        if(rW){
          const pMatch=resolveUserElimMatch(m.id,preds);
          const pW=pMatch?.winner||null;
          if(pW&&rW===pW){pts+=phasePts;breakdown[m.id+'_c']=phasePts;}
        }
      }
    });
  });

  // ── Champion (only if real winner of final is known) ──
  const realChamp=getElimResult('m104',rElim,'winner')||results.champion||'';
  const predChampMatch=resolveUserElimMatch('m104',preds);
  const predChamp=predChampMatch?.winner||'';
  if(realChamp&&predChamp&&nrm(predChamp)===nrm(realChamp)){pts+=PTS.champion;breakdown['champion']=PTS.champion;}

  // ── Premios (only if real value is set) ──
  [{k:'balon',p:PTS.balon},{k:'maxGolEsp',p:PTS.maxGolEsp},{k:'mejorJoven',p:PTS.mejorJoven},{k:'maxGolesGol',p:PTS.maxGolesGol}].forEach(({k,p})=>{
    if(results[k]&&String(results[k]).trim()!==''&&preds[k]&&nrm(String(preds[k]))===nrm(String(results[k]))){pts+=p;breakdown[k]=p;}
  });

  return{pts,breakdown};
}

function subscribeRT(){
  if(S.unsub){S.unsub();S.unsub=null;}
  if(S.unsubResults){S.unsubResults();S.unsubResults=null;}
  const{collection,doc,onSnapshot}=fns();

  // Listen to users collection
  S.unsub=onSnapshot(collection(db(),'users'),snap=>{
    S.allUsers=snap.docs.map(d=>({id:d.id,...d.data()}));
    if(S.currentTab==='clasif') renderClasif(document.getElementById('mc'));
  });

  // Listen to results doc — re-renders ranking and shows pts when admin saves
  S.unsubResults=onSnapshot(doc(db(),'config','results'),snap=>{
    if(snap.exists()){
      S.results={...S.results,...snap.data()};
      // Re-render whatever tab is active that depends on results
      const mc=document.getElementById('mc');
      if(S.currentTab==='clasif') renderClasif(mc);
      else if(S.currentTab==='grupos') renderGroupContent();
      else if(S.currentTab==='elim') renderElimContent();
      else if(S.currentTab==='premios') renderPremios(mc);
    }
  });
}

function calcUserProgress(preds){
  if(!preds) return 0;
  const gDone=GROUP_MATCHES.filter(m=>{const r=(preds.groups||{})[m.id];return r&&r.home!==''&&r.home!==null&&r.home!==undefined&&r.away!==''&&r.away!==null&&r.away!==undefined;}).length;
  const eDone=ELIM_PHASES.reduce((a,ph)=>a+ph.matches.filter(m=>{const r=(preds.elim||{})[m.id];return r&&r.home!==''&&r.home!==null&&r.away!==''&&r.away!==null;}).length,0);
  const pDone=(preds.balon?1:0)+(preds.maxGolEsp?1:0)+(preds.mejorJoven?1:0)+(preds.maxGolesGol!==''&&preds.maxGolesGol!==null&&preds.maxGolesGol!==undefined?1:0)+(preds.champion||(getElimResult('m104',preds.elim||{},'winner'))?1:0);
  const total=GROUP_MATCHES.length+ELIM_PHASES.reduce((a,ph)=>a+ph.matches.length,0)+5;
  return Math.round((gDone+eDone+pDone)/total*100);
}

function renderClasif(mc){
  let html=`<div class="section-header"><h2>Clasificación</h2><p>Participantes, pagos y puntuación.</p></div>`;

  // Tabs
  html+=`<div class="clasif-tabs">
    <button class="clasif-tab${S.clasifView==='participants'?' active':''}" onclick="setClasiView('participants')">👥 Participantes</button>
    <button class="clasif-tab${S.clasifView==='ranking'?' active':''}" onclick="setClasiView('ranking')">🏆 Ranking</button>
  </div>`;

  // Filter out admin
  const users=S.allUsers.filter(u=>u.id!==ADMIN_USER.toLowerCase());
  const paid=users.filter(u=>u.paid).length;

  html+=`<div class="participants-summary">
    <div class="stat"><span class="val">${users.length}</span><span class="lbl">Inscritos</span></div>
    <div class="stat"><span class="val" style="color:var(--green)">${paid}</span><span class="lbl">Pagados</span></div>
    <div class="stat"><span class="val" style="color:var(--red)">${users.length-paid}</span><span class="lbl">Pendiente</span></div>
    <div class="stat"><span class="val">${users.filter(u=>u.preds).length}</span><span class="lbl">Con pronóst.</span></div>
  </div>`;

  if(S.clasifView==='participants'){
    // Participants list — visible to all always (open or live)
    if(users.length===0){
      html+=`<div class="empty-state"><span class="icon">😴</span>Nadie se ha registrado todavía</div>`;
      mc.innerHTML=html;return;
    }
    // Sort: paid first, then by name
    const sorted=[...users].sort((a,b)=>{
      if(!!b.paid!==!!a.paid) return b.paid?1:-1;
      return (a.nombre||a.id).localeCompare(b.nombre||b.id);
    });
    sorted.forEach(u=>{
      const isMe=u.id===S.user?.toLowerCase();
      const pct=calcUserProgress(u.preds);
      const initials=(u.nombre||u.id).slice(0,2).toUpperCase();
      const isPaid=!!u.paid;
      html+=`<div class="participant-card${isMe?' me':''}">
        <div class="participant-avatar">${initials}</div>
        <div class="participant-info">
          <div class="participant-name">${u.nombre||u.id}${isMe?'<span class="me-badge">Tú</span>':''}</div>
          <div class="participant-sub">
            <span>${pct}% completado</span>
          </div>
          <div class="progress-bar-outer"><div class="progress-bar-inner${pct===100?' full':''}" style="width:${pct}%"></div></div>
        </div>
        ${S.isAdmin
          ?`<div style="display:flex;flex-direction:column;align-items:center;gap:5px;flex-shrink:0">
              <button class="paid-toggle" title="${isPaid?'Marcar como no pagado':'Marcar como pagado'}" onclick="togglePaid('${u.id}')">${isPaid?'✅':'⬜'}</button>
              <button onclick="openPredModal('${u.id}')" style="font-size:16px;background:none;border:none;cursor:pointer;padding:0" title="Ver pronósticos">👁️</button>
            </div>`
          :`<span class="paid-badge ${isPaid?'yes':'no'}">${isPaid?'✅ Pagado':'⏳ Pendiente'}</span>`
        }
      </div>`;
    });
  } else {
    // Ranking tab — locked until torneo starts (admin sees preview but with note)
    if(S.torneoState==='open'&&!S.isAdmin){
      html+=`<div class="empty-state"><span class="icon">🔒</span>El ranking se muestra cuando empiece el torneo</div>`;
      mc.innerHTML=html;return;
    }
    if(S.torneoState==='open'&&S.isAdmin){
      html+=`<div style="background:rgba(245,158,11,.08);border:1px solid rgba(245,158,11,.3);border-radius:var(--radius);padding:10px 14px;margin-bottom:12px;font-size:12px;color:#fcd34d">⚠️ Vista previa solo para admin — los puntos solo se actualizan cuando introduzcas resultados reales.</div>`;
    }
    const scored=users.filter(u=>u.preds).map(u=>{
      const{pts,breakdown}=calcScore(u.preds,S.results);
      return{...u,pts,breakdown};
    }).sort((a,b)=>b.pts-a.pts);
    if(scored.length===0){
      html+=`<div class="empty-state"><span class="icon">😴</span>Nadie ha guardado pronósticos todavía</div>`;
      mc.innerHTML=html;return;
    }
    html+=`<div class="rank-list">`;
    scored.forEach((u,i)=>{
      const isMe=u.id===S.user?.toLowerCase();
      const pos=i+1;
      const pc=pos===1?'g':pos===2?'s':pos===3?'b':'';
      const medal=pos===1?'🥇':pos===2?'🥈':pos===3?'🥉':pos;
      const champ=resolveUserElimMatch('m104',u.preds||{})?.winner||u.preds?.champion||'';
      const pct=calcUserProgress(u.preds);
      html+=`<div class="rank-card${isMe?' me':''}">
        <div class="rank-pos ${pc}">${medal}</div>
        <div class="rank-info">
          <div class="rank-name">${u.nombre||u.id}${isMe?'<span class="me-badge">Tú</span>':''}</div>
          ${champ?`<div class="rank-sub">${fl(champ)} ${champ}</div>`:''}
          <div class="rank-sub" style="margin-top:3px">${pct}% completado</div>
        </div>
        <div class="rank-pts-wrap"><span class="rank-pts">${u.pts}</span><span class="rank-pts-label">pts</span></div>
      </div>`;
    });
    html+=`</div>`;
  }

  mc.innerHTML=html;
}

function setClasiView(view){
  S.clasifView=view;
  renderClasif(document.getElementById('mc'));
}

async function togglePaid(userId){
  if(!S.isAdmin) return;
  const u=S.allUsers.find(u=>u.id===userId);
  if(!u) return;
  const newPaid=!u.paid;
  try{
    await fbSet('users',userId,{paid:newPaid});
    toast(newPaid?'✅ Marcado como pagado':'Marcado como pendiente');
  }catch(e){toast('Error: '+e.message,'err');}
}

function cancelEditMatch(){
  S._editingMatch=null;
  renderAdmin(document.getElementById('mc'));

function setManualTeams(matchId){
  const home=document.getElementById('mh_'+matchId)?.value;
  const away=document.getElementById('ma_'+matchId)?.value;
  if(!home||!away){toast('Selecciona ambos equipos','err');return;}
  if(home===away){toast('Los dos equipos no pueden ser el mismo','err');return;}
  if(!S.results.elim[matchId]) S.results.elim[matchId]={home:'',away:'',pen:null};
  S.results.elim[matchId].homeTeam=home;
  S.results.elim[matchId].awayTeam=away;
  S.results.elim[matchId].manualTeams=true;
  S._editingMatch=null;
  toast('✅ Equipos actualizados — guarda para confirmar');
  renderAdmin(document.getElementById('mc'));
}
function clearManualTeams(matchId){
  if(S.results.elim[matchId]){
    delete S.results.elim[matchId].manualTeams;
    S.results.elim[matchId].homeTeam=null;
    S.results.elim[matchId].awayTeam=null;
  }
  S._editingMatch=null;
  renderAdmin(document.getElementById('mc'));
}

async function resetSection(section){
  const labels={
    grupos:'resultados de grupos',r32:'dieciseisavos',r16:'octavos',
    qf:'cuartos',sf:'semis',final:'la final',p34:'el 3er puesto',
    elim_all:'toda la eliminatoria',premios:'los premios',todo:'TODO'
  };
  const label=labels[section]||section;
  if(!confirm(`¿Seguro que quieres borrar ${label}? Esta acción no se puede deshacer.`)) return;

  const matchIdsForPhase=(phase)=>{
    if(phase==='r32') return R32.map(m=>m.id);
    if(phase==='r16') return R16.map(m=>m.id);
    if(phase==='qf')  return QF.map(m=>m.id);
    if(phase==='sf')  return SF.map(m=>m.id);
    if(phase==='final') return FINAL.map(m=>m.id);
    if(phase==='p34') return P34.map(m=>m.id);
    return [];
  };

  if(section==='grupos'){
    S.results.groups={};
    S.results.tiebreaks={};
  } else if(section==='elim_all'){
    S.results.elim={};
  } else if(section==='premios'){
    S.results.balon='';S.results.maxGolEsp='';
    S.results.mejorJoven='';S.results.maxGolesGol='';
    S.results.champion='';
  } else if(section==='todo'){
    S.results={groups:{},tiebreaks:{},elim:{},balon:'',maxGolEsp:'',mejorJoven:'',maxGolesGol:'',champion:''};
  } else {
    // Phase-specific: clear only those match IDs
    const ids=matchIdsForPhase(section);
    if(!S.results.elim) S.results.elim={};
    ids.forEach(id=>{ delete S.results.elim[id]; });
  }

  try{
    await fbSet('config','results',sanitizeForFirebase(S.results));
    toast(`✅ ${label} borrado`);
    renderAdmin(document.getElementById('mc'));
  }catch(e){toast('❌ '+e.message,'err');}
}

function adminGroupHTML(g){

    ti.teams.forEach(team=>{
      const pos=current.indexOf(team);
      html+=`<button class="tiebreak-team-btn${pos!==-1?' selected':''}" onclick="setAdminGroupTie('${esc(ti.key)}','${esc(team)}','${g}')">
        ${pos!==-1?`${pos+1}. `:''}${fl(team)} ${team}
      </button>`;
    });
    html+=`</div></div>`;
  });

  html+=`<button class="admin-save" onclick="saveResults()">💾 Guardar</button>`;
  return html;
}

function adminElimMatchHTML(m){
  const r=S.results.elim?.[m.id]||{};
  let ht=null,at=null;
  const resolveSrcR=(src)=>{
    if(!src) return null;
    if(src.endsWith('_loser')) return getElimResult(src.replace('_loser',''),S.results.elim||{},'loser');
    return getElimResult(src,S.results.elim||{},'winner');
  };
  if(r.manualTeams){
    // Manual override — use stored teams, skip auto-calculation entirely
    ht=r.homeTeam||null;
    at=r.awayTeam||null;
  } else {
    // Auto-calculate teams
    if(m.home&&!m.home.startsWith('T3_')) ht=resolveCode(m.home,S.results.groups||{},S.results.tiebreaks||{},S.results.elim||{});
    if(!ht&&m.srcA) ht=resolveSrcR(m.srcA);
    if(m.away&&!m.away.startsWith('T3_')) at=resolveCode(m.away,S.results.groups||{},S.results.tiebreaks||{},S.results.elim||{});
    else if(m.away&&m.away.startsWith('T3_')){
      const assignments=computeT3Assignments(S.results.groups||{},S.results.tiebreaks||{});
      at=assignments[m.id]||null;
    }
    if(!at&&m.srcB) at=resolveSrcR(m.srcB);
    // Store auto-calculated teams
    if(!S.results.elim[m.id]) S.results.elim[m.id]={home:'',away:'',pen:null};
    S.results.elim[m.id].homeTeam=ht;
    S.results.elim[m.id].awayTeam=at;
  }
  const hv=r.home!==''&&r.home!==null&&r.home!==undefined?r.home:'';
  const av=r.away!==''&&r.away!==null&&r.away!==undefined?r.away:'';
  const sign=getSign(r);
  const isDraw=sign==='X';
  const isEditing=S._editingMatch===m.id;
  const allTeams=Object.values(GROUPS).flat().sort();
  let html=`<div class="match-card" style="margin-bottom:6px">
  <div class="match-header">
    <span class="match-label">${m.label}</span>
    <div style="display:flex;align-items:center;gap:6px">
      ${r.manualTeams?`<span style="font-size:9px;font-weight:700;padding:1px 5px;border:1px solid rgba(245,158,11,.4);border-radius:3px;color:var(--amber)">✏️ MANUAL</span>`:''}
      <button onclick="startEditMatch('${m.id}')" style="font-size:10px;padding:2px 7px;border-radius:4px;border:1px solid var(--border);background:var(--surface);color:var(--txt-dim);cursor:pointer">${isEditing?'✗ Cerrar':'✏️ Equipos'}</button>
      ${r.manualTeams?`<button onclick="clearManualTeams('${m.id}')" style="font-size:10px;padding:2px 7px;border-radius:4px;border:1px solid var(--red-dim);background:rgba(239,68,68,.08);color:#fca5a5;cursor:pointer">🔄 Auto</button>`:''}
    </div>
  </div>
  ${isEditing?`<div style="padding:10px 12px;background:var(--surface);border-bottom:1px solid var(--border)">
    <div style="font-size:11px;font-weight:700;color:var(--gold);margin-bottom:8px">Seleccionar equipos manualmente:</div>
    <div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap">
      <select id="mh_${m.id}" style="flex:1;min-width:140px;background:var(--card);border:1px solid var(--border);border-radius:6px;padding:7px 8px;color:var(--txt);font-size:12px">
        <option value="">— Local —</option>
        ${allTeams.map(t=>`<option value="${esc(t)}"${ht===t?' selected':''}>${fl(t)} ${t}</option>`).join('')}
      </select>
      <span style="color:var(--txt-dim);font-weight:700">vs</span>
      <select id="ma_${m.id}" style="flex:1;min-width:140px;background:var(--card);border:1px solid var(--border);border-radius:6px;padding:7px 8px;color:var(--txt);font-size:12px">
        <option value="">— Visitante —</option>
        ${allTeams.map(t=>`<option value="${esc(t)}"${at===t?' selected':''}>${fl(t)} ${t}</option>`).join('')}
      </select>
      <button onclick="setManualTeams('${m.id}')" style="background:var(--green);color:#fff;padding:7px 14px;border-radius:6px;font-size:12px;font-weight:700;white-space:nowrap">✓ Confirmar</button>
    </div>
    <div style="font-size:10px;color:var(--txt-dim);margin-top:6px">⚠️ Los partidos posteriores que dependen de éste se recalcularán automáticamente.</div>
  </div>`:''}
  <div class="match-body">
    <span class="match-flag">${ht?fl(ht):'❓'}</span>
    <span class="match-name home">${ht||'TBD'}</span>
    <div class="score-wrap">
      <input class="admin-score" type="number" min="0" max="20" value="${hv}" placeholder="–"
        oninput="setAdminElim('${m.id}','home',this.value,'${esc(ht||'')}','${esc(at||'')}')">
      <span class="score-sep">:</span>
      <input class="admin-score" type="number" min="0" max="20" value="${av}" placeholder="–"
        oninput="setAdminElim('${m.id}','away',this.value,'${esc(ht||'')}','${esc(at||'')}')">
    </div>
    <span class="match-name away">${at||'TBD'}</span>
    <span class="match-flag">${at?fl(at):'❓'}</span>
  </div>`;
  if(isDraw&&ht&&at){
    const ph=r.pen==='home',pa=r.pen==='away';
    html+=`<div class="match-footer">
      <span class="pen-label">Clasifica en penaltis:</span>
      <button class="pen-btn${ph?' active':''}" onclick="setPen('result','${m.id}','home')">${fl(ht)} ${ht}</button>
      <button class="pen-btn${pa?' active':''}" onclick="setPen('result','${m.id}','away')">${fl(at)} ${at}</button>
    </div>`;
  } else if(isDraw&&(!ht||!at)){
    html+=`<div class="match-footer"><span style="font-size:11px;color:var(--amber)">⚠️ Empate — introduce antes los partidos anteriores</span></div>`;
  }
  html+=`</div>`;
  return html;
}

function adminGroup(g,btn){
  if(btn){btn.closest('.admin-section').querySelectorAll('.phase-tab').forEach(b=>b.classList.remove('active'));btn.classList.add('active');}
  document.getElementById('admin-group-content').innerHTML=adminGroupHTML(g);
}

function setAdminGroup(id,side,val){
  if(!S.results.groups) S.results.groups={};
  if(!S.results.groups[id]) S.results.groups[id]={home:'',away:''};
  S.results.groups[id][side]=val===''?'':parseInt(val,10);
}

function setAdminElim(id,side,val,ht,at){
  if(!S.results.elim) S.results.elim={};
  if(!S.results.elim[id]) S.results.elim[id]={home:'',away:'',pen:null,homeTeam:ht||null,awayTeam:at||null};
  S.results.elim[id][side]=val===''?'':parseInt(val,10);
  S.results.elim[id].homeTeam=ht||S.results.elim[id].homeTeam;
  S.results.elim[id].awayTeam=at||S.results.elim[id].awayTeam;
  if(getSign(S.results.elim[id])!=='X') S.results.elim[id].pen=null;
  renderAdmin(document.getElementById('mc'));
}

function setAdminGroupTie(tbKey,team,g){
  if(!S.results.tiebreaks) S.results.tiebreaks={};
  const current=[...(S.results.tiebreaks[tbKey]||[])];
  const idx=current.indexOf(team);
  if(idx>=0) current.splice(idx,1); else current.push(team);
  S.results.tiebreaks[tbKey]=current;
  adminGroup(g,null);
}

function setAdminT3Tie(team){
  if(!S.results.tiebreaks) S.results.tiebreaks={};
  const current=[...(S.results.tiebreaks['t3_ranking']||[])];
  const idx=current.indexOf(team);
  if(idx>=0) current.splice(idx,1); else current.push(team);
  S.results.tiebreaks['t3_ranking']=current;
  renderAdmin(document.getElementById('mc'));
}

function setAdminResult(k,v){S.results[k]=v;}

async function setTorneoState(state){
  S.torneoState=state;
  await fbSet('config','torneo',{state});
  updateStatusBar();toast('Estado: '+state);
  renderAdmin(document.getElementById('mc'));
}

async function saveResults(){
  try{
    const resultsToSave=sanitizeForFirebase({
      ...S.results,
      elim:Object.fromEntries(
        Object.entries(S.results.elim||{}).map(([k,v])=>[k,{
          home:v.home??null,
          away:v.away??null,
          pen:v.pen??null,
          homeTeam:v.homeTeam??null,
          awayTeam:v.awayTeam??null,
          manualTeams:v.manualTeams??false
        }])
      )
    });
    await fbSet('config','results',resultsToSave);
    toast('✅ Resultados guardados');
  }catch(e){toast('❌ '+e.message,'err');}
}

function openPredModal(userId){
  if(!S.isAdmin) return;
  const u=S.allUsers.find(u=>u.id===userId);

    toast('Este usuario no tiene pronósticos guardados','warn');

  document.getElementById('preds-modal-title').textContent=`👁️ ${nombre}`;
  document.getElementById('preds-modal-body').innerHTML=renderUserPreds(p);
  document.getElementById('preds-modal').classList.remove('hidden');
}

  document.getElementById('preds-modal').classList.add('hidden');
}

function renderUserPreds(p){
  let html='';
  const rGroups=S.results.groups||{};
  const rElim=S.results.elim||{};

  // ── GRUPOS ──
  html+=`<div class="preds-section"><h3>🗂️ Fase de Grupos — clasificación pronosticada</h3>`;
  Object.keys(GROUPS).forEach(g=>{
    const{standings}=computeStandings(g,p.groups||{},p.tiebreaks||{});
    const rStand=S.results.groups&&Object.keys(S.results.groups).length>0?computeStandings(g,rGroups,S.results.tiebreaks||{}).standings:null;
    const p1=standings[0]?.name||'—';
    const p2=standings[1]?.name||'—';
    const p3=standings[2]?.name||'—';
    const r1=rStand?.[0]?.name;const r2=rStand?.[1]?.name;
    const hit1=r1&&r1===p1;const hit2=r2&&r2===p2;
    html+=`<div class="preds-group-row">
      <span class="preds-group-label">${g}</span>
      <span class="pos-badge p1">1</span>
      <span class="${r1?(hit1?'preds-hit':'preds-miss'):''}"> ${fl(p1)} ${p1}</span>
      <span class="pos-badge p2" style="margin-left:8px">2</span>
      <span class="${r2?(hit2?'preds-hit':'preds-miss'):''}"> ${fl(p2)} ${p2}</span>
      <span style="color:var(--txt-dim);font-size:10px;margin-left:auto">3º ${fl(p3)} ${p3}</span>
    </div>`;
  });
  html+=`</div>`;

  // ── TERCEROS ──
  const top8=getTop8Thirds(p.groups||{},p.tiebreaks||{});
  const rTop8=getTop8Thirds(rGroups,S.results.tiebreaks||{});
  const rTop8names=new Set(rTop8.map(t=>t.team));
  if(top8.length>0){
    html+=`<div class="preds-section"><h3>🎯 Mejores Terceros pronosticados</h3><div style="display:flex;flex-wrap:wrap;gap:5px">`;
    top8.forEach((t,i)=>{
      const hit=rTop8names.has(t.team);
      html+=`<span style="display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:5px;font-size:11px;font-weight:600;background:var(--card);border:1px solid ${rTop8.length>0?(hit?'var(--green-dim)':'var(--red-dim)'):'var(--border)'};color:${rTop8.length>0?(hit?'var(--green)':'#fca5a5'):'var(--txt)'}">${fl(t.team)} ${t.team} <span style="color:var(--txt-dim)">(G.${t.group})</span></span>`;
    });
    html+=`</div></div>`;
  }

  // ── ELIMINATORIAS ──
  html+=`<div class="preds-section"><h3>🏟️ Eliminatorias — clasificados pronosticados</h3>`;
  ELIM_PHASES.forEach(({phase,label,pts,matches})=>{
    if(pts===0&&phase==='p34') return; // skip 3rd place for display
    html+=`<div style="font-size:10px;font-weight:700;color:var(--txt-dim);text-transform:uppercase;letter-spacing:.5px;margin:8px 0 4px">${label}</div>`;
    matches.forEach(m=>{
      const pr=p.elim?.[m.id];
      if(!pr||pr.home===''||pr.home===null||pr.away===''||pr.away===null){
        html+=`<div class="preds-elim-row"><span class="preds-elim-label">${m.label}</span><span class="preds-unknown">Sin pronosticar</span></div>`;
        return;
      }
      // Resolve predicted winner using the engine
      const pMatch=resolveUserElimMatch(m.id,p);
      const predWinner=pMatch?.winner||null;
      const predHome=pMatch?.homeTeam||'?';
      const predAway=pMatch?.awayTeam||'?';
      const rW=getElimResult(m.id,rElim,'winner');
      const hit=rW&&predWinner&&rW===predWinner;
      const sign=getSign(pr);
      const scoreStr=pr.home!==null&&pr.home!==''&&pr.away!==null&&pr.away!==''?`${pr.home}–${pr.away}${sign==='X'&&pr.pen?` (pen. ${pr.pen==='home'?predHome:predAway})`:''}`:'-';
      html+=`<div class="preds-elim-row">
        <span class="preds-elim-label">${m.label}</span>
        <span style="flex:1">${fl(predHome)} ${predHome} <strong>${scoreStr}</strong> ${fl(predAway)} ${predAway}</span>
        ${predWinner?`<span class="${rW?(hit?'preds-hit':'preds-miss'):''}">→ ${fl(predWinner)} ${predWinner}${rW?(hit?' ✅':' ✗'):''}</span>`:''}
      </div>`;
    });
  });
  html+=`</div>`;

  // ── PREMIOS ──
  html+=`<div class="preds-section"><h3>🏅 Premios</h3>`;
  const champ=resolveUserElimMatch('m104',p)?.winner||p.champion||'';
  const rChamp=getElimResult('m104',rElim,'winner')||S.results.champion||'';
  const champHit=rChamp&&champ&&nrm(champ)===nrm(rChamp);
  html+=`<div class="preds-elim-row"><span class="preds-elim-label">🏆 Campeón</span><span class="${rChamp?(champHit?'preds-hit':'preds-miss'):''}${!champ?' preds-unknown':''}">${champ?`${fl(champ)} ${champ}`:'Sin rellenar'}${rChamp?(champHit?' ✅':' ✗'):''}</span></div>`;
  [{k:'balon',label:'Balón de Oro'},{k:'maxGolEsp',label:'Goleador España'},{k:'mejorJoven',label:'Mejor Joven'},{k:'maxGolesGol',label:'Goles pichichi'}].forEach(({k,label})=>{
    const val=p[k]||'';
    const rVal=S.results[k]||'';
    const hit=rVal&&val&&nrm(String(val))===nrm(String(rVal));
    html+=`<div class="preds-elim-row"><span class="preds-elim-label">${label}</span><span class="${rVal?(hit?'preds-hit':'preds-miss'):''}${!val?' preds-unknown':''}">${val||'Sin rellenar'}${rVal?(hit?' ✅':' ✗'):''}</span></div>`;
  });
  html+=`</div>`;

  // ── PUNTUACIÓN ACTUAL ──
  const{pts,breakdown}=calcScore(p,S.results);
  html+=`<div style="background:var(--gold-bg);border:1px solid var(--gold-dim);border-radius:var(--radius);padding:12px 14px;text-align:center">
    <div style="font-size:11px;color:var(--txt-dim);text-transform:uppercase;font-weight:700;letter-spacing:.5px;margin-bottom:4px">Puntuación actual</div>
    <div style="font-size:32px;font-weight:700;color:var(--gold)">${pts} pts</div>
  </div>`;

  return html;
}

},{once:true});
if(window._fbReady) window.dispatchEvent(new Event('fbReady'));

Object.assign(window,{

  setAdminGroup,setAdminElim,setAdminGroupTie,setAdminT3Tie,setAdminResult,setTorneoState,

});
